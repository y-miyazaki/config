# Reusable workflow: Loop caller orchestration (entity)
# Shared detect → execute (matrix) → record-skip job graph for on-loop-*.yaml callers.
# Binds one GitHub entity event via loop-entity-detect, then reuses ci-loop-agent.
# Design doc: docs/explanation/loop-engineering/loop-caller-reusable-design.md
# Inputs reference: docs/explanation/loop-engineering/workflows/loop-caller-inputs-reference.md
# Token resolution: per-job loop-resolve-push-token (App → GH_TOKEN → job GITHUB_TOKEN).
# Do not fan out resolved tokens via job outputs — see:
#   docs/explanation/loop-engineering/loop-caller-reusable-design.md#github-token-resolution
name: ci-loop-caller-entity

on:
  workflow_call:
    inputs:
      additional_commit_paths:
        default: ""
        description: "Comma-separated paths to commit with state after domain persistence"
        required: false
        type: string
      agent_allowed_tools:
        default: ""
        description: 'Newline-separated permission rules the skill needs, in the engine''s own syntax (claude: "Bash(gh issue edit:*)"). Caller-declared only — never derived from detect output. Empty grants nothing beyond the repository''s .claude/settings.json'
        required: false
        type: string
      agent_checker_effort:
        default: ""
        description: "Checker reasoning effort (claude: low|medium|high|xhigh|max). Empty = engine default"
        required: false
        type: string
      agent_checker_instructions:
        description: "Domain-specific APPROVE/REJECT rubric"
        required: true
        type: string
      agent_checker_max_turns:
        description: "Maximum checker agent turns per verification"
        required: true
        type: number
      agent_checker_model:
        description: "Checker model ID"
        required: true
        type: string
      agent_checker_skill_name:
        default: loop-verifier
        description: "Checker skill slash-loaded by loop-execute (distinct from agent_maker_skill_name)"
        required: false
        type: string
      agent_loop_max_attempts:
        description: "Maximum Agent→Verify retry cycles"
        required: true
        type: number
      agent_maker_effort:
        default: ""
        description: "Maker reasoning effort (claude: low|medium|high|xhigh|max). Empty = engine default"
        required: false
        type: string
      agent_maker_instructions:
        default: ""
        description: "Domain-specific maker instructions"
        required: false
        type: string
      agent_maker_max_turns:
        description: "Maximum maker agent turns per loop attempt"
        required: true
        type: number
      agent_maker_model:
        description: "Maker model ID"
        required: true
        type: string
      agent_maker_skill_name:
        description: "Skill package name"
        required: true
        type: string
      allowlist:
        default: ""
        description: "Comma-separated globs the maker may modify"
        required: false
        type: string
      branch_prefix:
        default: "loop"
        description: "Worktree branch prefix (L2/L3)"
        required: false
        type: string
      branch_state:
        description: "Branch for .loop/* persistence, state migration, and watch fallback when branch_match is empty"
        required: true
        type: string
      budget_file:
        default: .loop/loop-budget.json
        description: "Path to loop budget JSON"
        required: false
        type: string
      budget_max_runs_per_day:
        description: "Daily run cap keyed by loop_name"
        required: false
        type: number
      budget_max_tokens_per_day:
        description: "Daily aggregated token cap"
        required: false
        type: number
      cli_version:
        default: "latest"
        description: "CLI agent version"
        required: false
        type: string
      commit_message:
        default: "chore: loop-automated update"
        description: "Commit message prefix for loop attempts (L2/L3)"
        required: false
        type: string
      delivery:
        default: none
        description: "Platform delivery after APPROVE: log | issue | notion | open_pr | none"
        required: false
        type: string
      denylist:
        default: ""
        description: "Comma-separated globs the maker must not touch"
        required: false
        type: string
      detect_domain_env_json:
        default: "{}"
        description: "JSON object of domain detect script environment variables"
        required: false
        type: string
      detect_script:
        description: "Path to domain detect_*.sh script"
        required: true
        type: string
      dispatch_hook_script:
        default: ""
        description: "Optional trusted post-detect hook script path"
        required: false
        type: string
      dispatch_hook_token:
        default: ""
        description: "Optional token for dispatch hook (empty → detect token)"
        required: false
        type: string
      domain_persistence_script:
        default: ""
        description: "Optional bash script for domain ledger persistence (finalize job)"
        required: false
        type: string
      engine:
        description: "AI engine: claude | copilot | codex | cursor"
        required: true
        type: string
      environment:
        default: default
        description: "GitHub environment for maintenance bot secrets"
        required: false
        type: string
      infer_files_pattern:
        default: ""
        description: "Extended regex to infer file paths from checker text"
        required: false
        type: string
      labels:
        default: "loop-automation"
        description: "Comma-separated labels for created PR (finalize job)"
        required: false
        type: string
      level:
        default: L1
        description: "Autonomy: L1 | L2 | L3"
        required: false
        type: string
      loop_name:
        description: "Loop identifier for state, budget, and concurrency"
        required: true
        type: string
      may_edit:
        default: false
        description: "Agent worktree edit gate: true | false"
        required: false
        type: boolean
      no_changes_verdict:
        default: APPROVE
        description: "APPROVE | REJECT when maker produces no file diff"
        required: false
        type: string
      outcome_override:
        default: ""
        description: "Optional explicit finalize outcome (e.g. watch)"
        required: false
        type: string
      pr_body:
        default: ""
        description: "Static markdown prefix for finalize PR body"
        required: false
        type: string
      pr_draft:
        default: false
        description: "Create open_pr finalize PR as draft when true"
        required: false
        type: boolean
      pr_title:
        default: ""
        description: "PR title when finalize strategy is open_pr"
        required: false
        type: string
      run_log_file:
        default: .loop/loop-run-log.md
        description: "JSONL run log path for budget aggregation"
        required: false
        type: string
      state_file:
        default: ""
        description: "Override state JSON path (default .loop/state-<loop_name>.json)"
        required: false
        type: string
      write_target:
        default: report
        description: "Agent artifact when may_edit is true: fix | report"
        required: false
        type: string
    secrets:
      AGENT_TOKEN:
        description: "Authentication token for the selected engine"
        required: true
      BOT_APP_CLIENT_ID:
        description: "GitHub App client ID for ruleset-bypass .loop/* pushes"
        required: false
      BOT_APP_PRIVATE_KEY:
        description: "GitHub App private key for ruleset-bypass .loop/* pushes"
        required: false
      GH_TOKEN:
        description: "Optional explicit GitHub token for resolution (defaults to job GITHUB_TOKEN when empty)"
        required: false

defaults:
  run:
    shell: bash

jobs:
  detect:
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
      issues: read
    outputs:
      delivery: ${{ steps.detect.outputs.delivery }}
      handoff_artifact_name: ${{ steps.detect.outputs.handoff_artifact_name }}
      run_started_at: ${{ steps.timing.outputs.started_at }}
      should_run: ${{ steps.detect.outputs.should_run }}
      skip_reason: ${{ steps.detect.outputs.skip_reason }}
      state_file: ${{ steps.detect.outputs.state_file }}
      target_matrix: ${{ steps.detect.outputs.target_matrix }}
    steps:
      - name: Record Run Start
        id: timing
        run: echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Export Detect Domain Env
        env:
          DETECT_DOMAIN_ENV_JSON: ${{ inputs.detect_domain_env_json }}
        run: |
          set -euo pipefail
          if [[ -n "${DETECT_DOMAIN_ENV_JSON}" && "${DETECT_DOMAIN_ENV_JSON}" != "{}" ]]; then
            if ! echo "${DETECT_DOMAIN_ENV_JSON}" | jq -e 'type == "object"' >/dev/null; then
              echo "detect_domain_env_json must be a JSON object" >&2
              exit 1
            fi
            if ! echo "${DETECT_DOMAIN_ENV_JSON}" | jq -e               'to_entries | map(.key) | all(test("^[A-Z_][A-Z0-9_]*$"))'               >/dev/null; then
              bad_key="$(echo "${DETECT_DOMAIN_ENV_JSON}" | jq -r                 'to_entries[] | select(.key | test("^[A-Z_][A-Z0-9_]*$") | not) | .key'                 | head -1)"
              echo "detect_domain_env_json keys must match ^[A-Z_][A-Z0-9_]*$ (invalid: ${bad_key})" >&2
              exit 1
            fi
            if ! echo "${DETECT_DOMAIN_ENV_JSON}" | jq -e \
              '[to_entries[] | select(.value != "" and ((.value | tostring) | test("[\r\n]")))] | length == 0' \
              >/dev/null; then
              bad_key="$(echo "${DETECT_DOMAIN_ENV_JSON}" | jq -r \
                'to_entries[] | select(.value != "" and ((.value | tostring) | test("[\r\n]"))) | .key' \
                | head -1)"
              echo "detect_domain_env_json values must not contain newlines (key: ${bad_key})" >&2
              exit 1
            fi
            while IFS= read -r -d '' entry; do
              printf '%s\n' "${entry}" >> "${GITHUB_ENV}"
            done < <(echo "${DETECT_DOMAIN_ENV_JSON}" | jq -jr \
              'to_entries[] | select(.value != "") | "\(.key)=\(.value)\u0000"')
          fi

      - name: Resolve GitHub Token
        id: resolve_github_token
        uses: y-miyazaki/config/.github/actions/loop-resolve-push-token@fe987efbd92d04a03a8a341b15e38e053f7d7fe4 # v1.8.113
        with:
          bot_app_client_id: ${{ secrets.BOT_APP_CLIENT_ID }}
          bot_app_private_key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          github_token: ${{ secrets.GH_TOKEN }}

      - name: Detect Loop Work
        id: detect
        uses: y-miyazaki/config/.github/actions/loop-entity-detect@fe987efbd92d04a03a8a341b15e38e053f7d7fe4 # v1.8.113
        with:
          agent_maker_instructions: ${{ inputs.agent_maker_instructions }}
          agent_maker_skill_name: ${{ inputs.agent_maker_skill_name }}
          budget_file: ${{ inputs.budget_file }}
          budget_max_runs_per_day: ${{ inputs.budget_max_runs_per_day != null && format('{0}', inputs.budget_max_runs_per_day) || '' }}
          budget_max_tokens_per_day: ${{ inputs.budget_max_tokens_per_day != null && format('{0}', inputs.budget_max_tokens_per_day) || '' }}
          delivery: ${{ inputs.delivery }}
          detect_script: ${{ inputs.detect_script }}
          dispatch_hook_script: ${{ inputs.dispatch_hook_script }}
          dispatch_hook_token: ${{ inputs.dispatch_hook_token }}
          github_token: ${{ steps.resolve_github_token.outputs.github_token }}
          level: ${{ inputs.level }}
          loop_name: ${{ inputs.loop_name }}
          may_edit: ${{ inputs.may_edit == true && 'true' || inputs.may_edit == false && 'false' || '' }}
          run_log_file: ${{ inputs.run_log_file }}
          state_file: ${{ inputs.state_file }}
          write_target: ${{ inputs.write_target }}

  execute:
    if: needs.detect.outputs.should_run == 'true'
    needs: detect
    permissions:
      actions: read
      contents: write
      copilot-requests: write # zizmor: ignore[excessive-permissions]
      issues: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.detect.outputs.target_matrix) }}
    uses: y-miyazaki/config/.github/workflows/ci-loop-agent.yaml@fe987efbd92d04a03a8a341b15e38e053f7d7fe4 # v1.8.113
    with:
      additional_commit_paths: ${{ inputs.additional_commit_paths }}
      agent_allowed_tools: ${{ inputs.agent_allowed_tools }}
      agent_checker_effort: ${{ inputs.agent_checker_effort }}
      agent_checker_instructions: ${{ inputs.agent_checker_instructions }}
      agent_checker_max_turns: ${{ inputs.agent_checker_max_turns }}
      agent_checker_model: ${{ inputs.agent_checker_model }}
      agent_checker_skill_name: ${{ inputs.agent_checker_skill_name }}
      agent_loop_max_attempts: ${{ inputs.agent_loop_max_attempts }}
      agent_maker_effort: ${{ inputs.agent_maker_effort }}
      agent_maker_max_turns: ${{ inputs.agent_maker_max_turns }}
      agent_maker_model: ${{ inputs.agent_maker_model }}
      agent_maker_skill_name: ${{ inputs.agent_maker_skill_name }}
      allowlist: ${{ inputs.allowlist }}
      auto_merge: ${{ (needs.detect.outputs.delivery == 'open_pr' && inputs.level == 'L3' && matrix.target.target_json.finalize == 'open_pr') && 'true' || 'false' }}
      base_branch: ${{ matrix.target.target_json.to.branch }}
      branch_prefix: ${{ inputs.branch_prefix }}
      cli_version: ${{ inputs.cli_version }}
      commit_message: ${{ inputs.commit_message }}
      current_sha: ${{ matrix.target.target_json.from.ref }}
      denylist: ${{ inputs.denylist }}
      detect_result_json: "{}"
      domain_persistence_script: ${{ inputs.domain_persistence_script }}
      engine: ${{ inputs.engine }}
      environment: ${{ inputs.environment }}
      finalize_enabled: ${{ needs.detect.outputs.delivery == 'open_pr' }}
      handoff_artifact_name: ${{ needs.detect.outputs.handoff_artifact_name }}
      handoff_key: ${{ matrix.target.handoff_key }}
      infer_files_pattern: ${{ inputs.infer_files_pattern }}
      labels: ${{ inputs.labels }}
      level: ${{ inputs.level }}
      loop_name: ${{ inputs.loop_name }}
      no_changes_verdict: ${{ inputs.no_changes_verdict }}
      outcome_override: ${{ inputs.outcome_override }}
      pr_body: ${{ inputs.pr_body }}
      pr_draft: ${{ inputs.pr_draft }}
      pr_title: ${{ inputs.pr_title }}
      prompt_text: ${{ matrix.target.prompt }}
      run_log_file: ${{ inputs.run_log_file }}
      run_started_at: ${{ needs.detect.outputs.run_started_at }}
      skip_reason: ${{ needs.detect.outputs.skip_reason }}
      state_file: ${{ needs.detect.outputs.state_file }}
      state_push_branch: ${{ inputs.branch_state }}
      target_json: ${{ toJson(matrix.target.target_json) }}
      verifier_context: ${{ matrix.target.verifier_context }}
    secrets:
      AGENT_TOKEN: ${{ secrets.AGENT_TOKEN }}
      BOT_APP_CLIENT_ID: ${{ secrets.BOT_APP_CLIENT_ID }}
      BOT_APP_PRIVATE_KEY: ${{ secrets.BOT_APP_PRIVATE_KEY }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}

  record-skip:
    # Record every non-run (circuit_breaker, budget, no_changes) so a quiet
    # cron tick is distinguishable from a loop that never started. Skipped
    # entries do not consume the daily budget (see loop-detect guards.sh).
    if: >-
      needs.detect.result == 'success' &&
      needs.detect.outputs.should_run == 'false'
    needs: detect
    environment: ${{ inputs.environment }}
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve GitHub Token
        id: resolve_github_token
        uses: y-miyazaki/config/.github/actions/loop-resolve-push-token@fe987efbd92d04a03a8a341b15e38e053f7d7fe4 # v1.8.113
        with:
          bot_app_client_id: ${{ secrets.BOT_APP_CLIENT_ID }}
          bot_app_private_key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          github_token: ${{ secrets.GH_TOKEN }}

      - name: Append Skip Run Log
        uses: y-miyazaki/config/.github/actions/loop-run-log@fe987efbd92d04a03a8a341b15e38e053f7d7fe4 # v1.8.113
        with:
          base_branch: ${{ inputs.branch_state }}
          github_token: ${{ steps.resolve_github_token.outputs.github_token }}
          loop_name: ${{ inputs.loop_name }}
          outcome: skipped
          run_log_file: ${{ inputs.run_log_file }}
          run_started_at: ${{ needs.detect.outputs.run_started_at }}
          skip_reason: ${{ needs.detect.outputs.skip_reason }}
