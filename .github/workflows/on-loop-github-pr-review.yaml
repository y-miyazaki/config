# Loop workflow: PR review (entity / L2)
# Design: docs/superpowers/specs/2026-10-17-loop-pr-review-design.md
# Requires repository secret: AGENT_TOKEN (engine API key).
#
# ROLLOUT WARNING: BOTH triggers are unsafe on a real base branch until the
# ci-loop-* SHA pins are bumped to a release that contains the loop-finalize
# `finalize_strategy: none` fix (plan Task 3). The currently pinned loop-finalize
# does not honor it: with the caller input `delivery: none`, an APPROVE verdict
# merges and pushes the agent branch (including .loop/review/pr-<n>.json) into
# the base branch. This applies to workflow_dispatch as well as pull_request_target.
# - Until the pin bump: use workflow_dispatch only on a throwaway base branch or repo.
# - The pull_request_target trigger below is COMMENTED OUT on purpose.
# - ENABLE ONLY AFTER the pin bump: uncomment the trigger, and re-run zizmor
#   (it has not checked the commented block).
# The jobs.loop.if gate already covers both events; enabling is uncommenting the trigger.
name: on-loop-github-pr-review

run-name: "${{ github.workflow }} PR #${{ github.event.pull_request.number || inputs.pr_number }}"

on:
  # Security model (required for zizmor ignore):
  # - The head is never checked out or executed; the loop runs from the base checkout.
  # - PR facts come from the event payload and gh API reads only.
  # - Job gated on same-repo, non-draft, non-bot PRs without no-loop / loop-automation labels.
  # pull_request_target: # zizmor: ignore[dangerous-triggers]
  #   types: [opened, ready_for_review]
  workflow_dispatch:
    inputs:
      force:
        default: false
        description: Review again even when a github-pr-review marker review already exists
        required: false
        type: boolean
      pr_number:
        description: Pull request number to review
        required: true
        type: number

permissions:
  actions: write
  contents: write
  copilot-requests: write # zizmor: ignore[excessive-permissions]
  issues: write
  pull-requests: write

concurrency:
  cancel-in-progress: false
  group: loop-github-pr-review-${{ github.event.pull_request.number || inputs.pr_number || github.run_id }}
  queue: max

jobs:
  loop:
    # Intake gate mirrors detect_pr_review.sh skip rules (D8): fork, draft,
    # bot-authored, and no-loop / loop-automation PRs are refused here so no run
    # is queued behind in-flight work. workflow_dispatch bypasses the gate; detect
    # applies the same conditions for that path.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'pull_request_target' &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.type != 'Bot' &&
        !contains(github.event.pull_request.labels.*.name, 'no-loop') &&
        !contains(github.event.pull_request.labels.*.name, 'loop-automation')
      )
    uses: ./.github/workflows/ci-loop-caller-entity.yaml
    with:
      # Review reads the PR and writes a report file only; posting is done by
      # post_review.sh (domain_persistence_script) after the checker approves.
      agent_allowed_tools: |
        Bash(gh api:*)
        Bash(gh pr diff:*)
        Bash(gh pr view:*)
        Bash(git show:*)
      agent_checker_effort: medium
      agent_checker_instructions: |
        ## Criteria for APPROVE

        ALL of the following must be true:
        1. Every finding has evidence of an allowed kind (rule, criteria, or bug)
        2. No finding falls under the "do not flag" list
        3. The premises (report `premises`, body section `### Premises checked`) record the result of checking the PR intent
        4. No file other than the report file was changed

        ## Criteria for REJECT

        ANY of the following triggers REJECT:
        - A finding without evidence, or one citing a rule or criteria that does not exist
        - A finding marked `in_diff: true` for a line that is not part of the diff
        - A finding whose rule or criteria evidence was read from the head instead of the base
        - Any file change other than the report file
      agent_checker_max_turns: 100
      agent_checker_model: claude-opus-5
      agent_checker_skill_name: loop-verifier
      agent_loop_max_attempts: 3
      agent_maker_effort: medium
      agent_maker_instructions: |
        1. Run the github-pr-review skill. Write the review report to `result.report_path`.
           Never post a review or comment yourself; a later step posts the report.
        2. Engine-specific input: use the engine's built-in code review capability read-only.
           Invoke `/code-review <pr_number>` WITHOUT `--comment`, and use it as extra input for
           bug findings only. Treat its output as material: drop anything that cannot satisfy
           the skill's evidence rules, and merge duplicates with the skill's own findings into one.
        3. This repository's exclusions: files regenerated by `apm install` (sync targets
           `.agents/`, `.claude/`, `.codex/`, `.cursor/`, `.kiro/`, `.vscode/`, `apm_modules/`)
           and `apm.lock.yaml` are not reviewed for content. BUT hand-editing a sync target
           violates the "Edit routing" rule in `CLAUDE.md` and must be reported as a finding,
           with rule evidence quoted from `CLAUDE.md` at the base commit.
        4. Review language: respond in the language of the PR title and body, unless
           `response_language` is given in Constraints.
      agent_maker_max_turns: 100
      agent_maker_model: claude-sonnet-5
      agent_maker_skill_name: github-pr-review
      allowlist: ""
      branch_state: main
      budget_max_runs_per_day: 20
      budget_max_tokens_per_day: 1000000
      delivery: none
      denylist: ""
      detect_domain_env_json: ${{ github.event_name == 'workflow_dispatch' && format('{{"PR_EXCLUDE_LABELS":"no-loop,loop-automation","PR_FORCE":"{0}","PR_NUMBER":"{1}"}}', inputs.force, inputs.pr_number) || '{"PR_EXCLUDE_LABELS":"no-loop,loop-automation"}' }}
      detect_script: .agents/skills/github-pr-review/scripts/detect_pr_review.sh
      domain_persistence_script: .agents/skills/github-pr-review/scripts/post_review.sh
      engine: claude
      environment: default
      level: L2
      loop_name: github-pr-review
      may_edit: true
      no_changes_verdict: REJECT
      write_target: report
    secrets:
      AGENT_TOKEN: ${{ secrets.AGENT_TOKEN }}
      BOT_APP_CLIENT_ID: ${{ secrets.MAINTENANCE_BOT_APP_CLIENT_ID }}
      BOT_APP_PRIVATE_KEY: ${{ secrets.MAINTENANCE_BOT_APP_PRIVATE_KEY }}
