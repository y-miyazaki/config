#######################################
# Description:
#   CI workflow: Go CI on push/PR
#
# Usage:
#   Copy to .github/workflows/ in your repository and adjust the with: values.
#   Runs on: push, pull_request
#
# Design Rules:
#   None
#
# Dependencies:
#   None
#
# References:
#   None
#######################################
name: on-ci-push-go

run-name: "${{ github.workflow }} (${{ github.event_name }})"

on:
  push:
    branches:
      - "main"
      - "master"
      - "hotfix/**"
      - "release/**"
      - "develop"
      - "feature/**"
    paths:
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - ".golangci.yaml"
  pull_request:
    branches:
      - "main"
      - "master"
      - "hotfix/**"
      - "release/**"
      - "develop"
      - "feature/**"
    paths:
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - ".golangci.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  detect-go-version:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      go-version: ${{ steps.read-go-version.outputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read go version from go.mod
        id: read-go-version
        run: |
          GO_VERSION=$(grep -E '^go ' go.mod | awk '{print $2}')
          echo "version=$GO_VERSION" >> "$GITHUB_OUTPUT"

  go-ci:
    needs: detect-go-version
    uses: y-miyazaki/config/.github/workflows/ci-go.yaml@8bc9aaf4012ede28f68eabe2edab4074566bc11f # v1.9.7

    with:
      component: "base"
      go_project_path: "."
      go_version: ${{ needs.detect-go-version.outputs.go-version }}
    permissions:
      contents: read
      id-token: write
      pull-requests: write
