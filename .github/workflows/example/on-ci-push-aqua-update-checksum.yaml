#######################################
# Description:
#   CI workflow: Aqua checksum update on push
#
# Usage:
#   Copy to .github/workflows/ in your repository and adjust the with: values.
#   Runs on: push
#   This workflow requires a GitHub App for auto-committing checksum updates.
#   1. Create a GitHub App with "Contents: Read & Write" repository permission.
#   2. Install the App on the target repository (or organization).
#   3. Pass BOT_APP_* via secrets: (remap MAINTENANCE_BOT_* as needed).
#
# Design Rules:
#   None
#
# Dependencies:
#   None
#
# References:
#   None
#######################################
name: on-ci-push-aqua-update-checksum

run-name: "${{ github.workflow }} (${{ github.event_name }})"

on:
  push:
    paths:
      - "aqua.yaml"
      - "aqua/*.yaml"

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  aqua-update-checksum:
    uses: y-miyazaki/config/.github/workflows/ci-aqua-update-checksum.yaml@5b0d8b8dabdebee9604fc58c23d516ae22db46c4 # v1.9.5

    permissions:
      contents: read
    secrets:
      BOT_APP_CLIENT_ID: ${{ secrets.MAINTENANCE_BOT_APP_CLIENT_ID }}
      BOT_APP_PRIVATE_KEY: ${{ secrets.MAINTENANCE_BOT_APP_PRIVATE_KEY }}
    with:
      environment: "default"
