#######################################
# Description:
#   CI workflow: GitHub Actions workflow lint on push/PR
#
# Usage:
#   Copy to .github/workflows/ in your repository and adjust the with: values.
#   Runs on: push, pull_request
#
# Design Rules:
#   None
#
# Dependencies:
#   None
#
# References:
#   None
#######################################
name: on-ci-push-github-actions-workflow

run-name: "${{ github.workflow }} (${{ github.event_name }})"

on:
  push:
    branches:
      - "main"
      - "master"
      - "hotfix/**"
      - "release/**"
      - "develop"
      - "feature/**"
    paths:
      - ".github/workflows/**/*.yml"
      - ".github/workflows/**/*.yaml"
      - ".github/actions/**/*.yml"
      - ".github/actions/**/*.yaml"
      - "scripts/ci/**"
      - "**/action.yml"
      - "**/action.yaml"
  pull_request:
    branches:
      - "main"
      - "master"
      - "hotfix/**"
      - "release/**"
      - "develop"
      - "feature/**"
    paths:
      - ".github/workflows/**/*.yml"
      - ".github/workflows/**/*.yaml"
      - ".github/actions/**/*.yml"
      - ".github/actions/**/*.yaml"
      - "scripts/ci/**"
      - "**/action.yml"
      - "**/action.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  github-actions-workflow-ci:
    uses: y-miyazaki/config/.github/workflows/ci-github-actions-workflow.yaml@8769b22af84d935b31a35095333ab0bd70214db5 # v1.9.10

    permissions:
      contents: read
