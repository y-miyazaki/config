#######################################
# Description:
#   CI workflow: mise lockfile update on push
#
# Usage:
#   Copy to .github/workflows/ in your repository and adjust the with: values.
#   Runs on: push
#   This workflow requires a GitHub App for auto-committing lockfile updates.
#   1. Create a GitHub App with "Contents: Read & Write" repository permission.
#   2. Install the App on the target repository (or organization).
#   3. Pass BOT_APP_* via secrets: (remap MAINTENANCE_BOT_* as needed).
#
# Design Rules:
#   None
#
# Dependencies:
#   None
#
# References:
#   None
#######################################
name: on-ci-push-mise-update-lock

run-name: "${{ github.workflow }} (${{ github.event_name }})"

on:
  push:
    paths:
      - "mise.toml"

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  mise-update-lock:
    uses: y-miyazaki/config/.github/workflows/ci-mise-update-lock.yaml@db802e0e018f38a3774b1fbb27cd5475ca12f6b9 # v1.9.5

    permissions:
      contents: read
    secrets:
      BOT_APP_CLIENT_ID: ${{ secrets.MAINTENANCE_BOT_APP_CLIENT_ID }}
      BOT_APP_PRIVATE_KEY: ${{ secrets.MAINTENANCE_BOT_APP_PRIVATE_KEY }}
    with:
      environment: "default"
      mise_version: "2026.6.13"
