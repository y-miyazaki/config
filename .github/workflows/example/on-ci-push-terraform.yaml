#######################################
# Description:
#   CI workflow: Terraform lint on push/PR (no AWS credentials)
#   Copy to .github/workflows/on-ci-push-terraform.yaml in your repository.
#
# Usage:
#   Copy to .github/workflows/ in your repository and adjust the with: values.
#   Runs on: push, pull_request
#
# Design Rules:
#   None
#
# Dependencies:
#   None
#
# References:
#   None
#######################################
name: on-ci-push-terraform

run-name: "${{ github.workflow }} (${{ github.event_name }})"

on:
  push:
    branches:
      - "main"
      - "master"
      - "hotfix/**"
      - "release/**"
      - "develop"
      - "feature/**"
    paths:
      - "**/*.tf"
      - "**/.tflint.hcl"
      - ".github/workflows/ci-terraform.yaml"
      - ".github/workflows/on-ci-push-terraform.yaml"
  pull_request:
    branches:
      - "main"
      - "master"
      - "hotfix/**"
      - "release/**"
      - "develop"
      - "feature/**"
    paths:
      - "**/*.tf"
      - "**/.tflint.hcl"
      - ".github/workflows/ci-terraform.yaml"
      - ".github/workflows/on-ci-push-terraform.yaml"

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  terraform-ci:
    uses: y-miyazaki/config/.github/workflows/ci-terraform.yaml@24740d69ea56bf5b54c9815e168966a51fc0908c # v1.9.6

    with:
      modules_path: modules
      recursive: true
      terraform_path: .
    permissions:
      contents: read
