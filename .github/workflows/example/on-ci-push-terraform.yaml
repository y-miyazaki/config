# CI workflow: Terraform lint on push/PR (no AWS credentials)
# Copy to .github/workflows/on-ci-push-terraform.yaml in your repository.
name: on-ci-push-terraform

run-name: "${{ github.workflow }} (${{ github.event_name }})"

on:
  push:
    branches:
      - "main"
      - "master"
      - "hotfix/**"
      - "release/**"
      - "develop"
      - "feature/**"
    paths:
      - "**/*.tf"
      - "**/.tflint.hcl"
      - ".github/workflows/ci-terraform.yaml"
      - ".github/workflows/on-ci-push-terraform.yaml"
  pull_request:
    branches:
      - "main"
      - "master"
      - "hotfix/**"
      - "release/**"
      - "develop"
      - "feature/**"
    paths:
      - "**/*.tf"
      - "**/.tflint.hcl"
      - ".github/workflows/ci-terraform.yaml"
      - ".github/workflows/on-ci-push-terraform.yaml"

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  terraform-ci:
    uses: y-miyazaki/config/.github/workflows/ci-terraform.yaml@82f074dcb97f8f889f957b87c6631daef9b5e01a # v1.8.129

    with:
      modules_path: modules
      recursive: true
      terraform_path: .
    permissions:
      contents: read
