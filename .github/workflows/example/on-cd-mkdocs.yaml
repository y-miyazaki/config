# CD workflow: Build and deploy MkDocs to GitHub Pages
name: on-cd-mkdocs

run-name: "${{ github.workflow }} (${{ github.event_name }})"

on:
  push:
    branches:
      - "main"
    paths:
      - "docs/**"
      - "mkdocs.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pages: write

jobs:
  build:
    uses: y-miyazaki/config/.github/workflows/cd-mkdocs.yaml@83b23799dc63e86ea7c7842eeebbd20ad8776071 # v1.8.109
    with:
      artifact_name: mkdocs-site
      config_file: mkdocs.yml
      pip_packages: mkdocs-material mdx-truly-sane-lists
    permissions:
      contents: read

  deploy:
    needs: build
    uses: y-miyazaki/config/.github/workflows/cd-github-pages.yaml@83b23799dc63e86ea7c7842eeebbd20ad8776071 # v1.8.109
    with:
      artifact_name: mkdocs-site
    permissions:
      contents: read
      id-token: write
      pages: write
