#######################################
# Description:
#   CI workflow: Node.js CI on push/PR
#
# Usage:
#   Copy to .github/workflows/ in your repository and adjust the with: values.
#   Runs on: push, pull_request
#
# Design Rules:
#   None
#
# Dependencies:
#   None
#
# References:
#   None
#######################################
name: on-ci-push-nodejs

run-name: "${{ github.workflow }} (${{ github.event_name }})"

on:
  push:
    branches:
      - "main"
      - "master"
      - "hotfix/**"
      - "release/**"
      - "develop"
      - "feature/**"
    paths:
      - "nodejs/**"
  pull_request:
    branches:
      - "main"
      - "master"
      - "hotfix/**"
      - "release/**"
      - "develop"
      - "feature/**"
    paths:
      - "nodejs/**"

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  nodejs-ci:
    uses: y-miyazaki/config/.github/workflows/ci-nodejs.yaml@48aeeea484a2b74d90043c803523e0b80126a063 # v1.9.4

    with:
      search_paths: nodejs
    permissions:
      contents: read
      id-token: write
      pull-requests: write
