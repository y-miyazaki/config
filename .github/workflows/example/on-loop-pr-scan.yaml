# Loop workflow: PR-head watch example
# Use when detect is git-based on open PR heads only — no Actions API CI scan.
# For CI failure repair see on-loop-ci-sweeper.yaml.
# Not scheduled in this repository — copy template only.
# Design doc: docs/explanation/loop-engineering/loop-caller-reusable-design.md
name: on-loop-pr-scan

on:
  workflow_dispatch: {}

permissions:
  actions: write
  contents: write
  copilot-requests: write # zizmor: ignore[excessive-permissions]
  issues: write
  pull-requests: write

concurrency:
  cancel-in-progress: false
  group: loop-state-main
  queue: max

jobs:
  loop:
    uses: y-miyazaki/config/.github/workflows/ci-loop-caller.yaml@85b694da37ac5e2e225409d46776ab668cfbda17 # v1.8.87
    with:
      agent_implementer_instructions: |
        Triage documentation drift on the PR head branch from detect facts.
      agent_implementer_max_turns: 5
      agent_implementer_model: cursor-grok-4.5-low
      agent_implementer_skill_name: docs-updater
      agent_loop_max_attempts: 3
      agent_verifier_instructions: |
        ## Criteria for APPROVE
        1. Changes are within allowlist and match detect facts
        ## Criteria for REJECT
        - Changes outside allowlist
      agent_verifier_max_turns: 3
      agent_verifier_model: composer-2.5
      allowlist: "docs/**/*.md"
      branch_match: main
      branch_state: main
      budget_max_runs_per_day: 1
      budget_max_tokens_per_day: 1000000
      delivery: open_pr
      detect_domain_env_json: "{}"
      detect_script: .agents/skills/docs-updater/scripts/detect_changes.sh
      engine: cursor
      environment: default
      level: L2
      loop_name: pr-scan-example
      max_targets_per_schedule: 3
      may_edit: true
      no_changes_verdict: REJECT
      pr_body: ""
      pr_enabled: true
      pr_title: "chore(loop): example PR-head watch"
      write_target: fix
    secrets:
      AGENT_TOKEN: ${{ secrets.AGENT_TOKEN }}
      BOT_APP_CLIENT_ID: ${{ secrets.MAINTENANCE_BOT_APP_CLIENT_ID }}
      BOT_APP_PRIVATE_KEY: ${{ secrets.MAINTENANCE_BOT_APP_PRIVATE_KEY }}
