# CI workflow: Shell script lint on push/PR
name: on-ci-push-shell-script

run-name: "${{ github.workflow }} (${{ github.event_name }})"

on:
  push:
    branches:
      - "main"
      - "master"
      - "hotfix/**"
      - "release/**"
      - "develop"
      - "feature/**"
    paths:
      - "**/*.sh"
      - "**/*.bats"
  pull_request:
    branches:
      - "main"
      - "master"
      - "hotfix/**"
      - "release/**"
      - "develop"
      - "feature/**"
    paths:
      - "**/*.sh"
      - "**/*.bats"

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  shell-script-ci:
    uses: y-miyazaki/config/.github/workflows/ci-shell-script.yaml@8e04c6183a8026b1f6daee7e916b641e918e57fa # v1.8.120

    with:
      script_path: "**/*.sh,**/*.bats"
    permissions:
      checks: write
      contents: read
      pull-requests: write
