#######################################
# Description:
#   CI workflow: Shell script lint on push/PR
#
# Usage:
#   Copy to .github/workflows/ in your repository and adjust the with: values.
#   Runs on: push, pull_request
#
# Design Rules:
#   None
#
# Dependencies:
#   None
#
# References:
#   None
#######################################
name: on-ci-push-shell-script

run-name: "${{ github.workflow }} (${{ github.event_name }})"

on:
  push:
    branches:
      - "main"
      - "master"
      - "hotfix/**"
      - "release/**"
      - "develop"
      - "feature/**"
    paths:
      - "**/*.sh"
      - "**/*.bats"
  pull_request:
    branches:
      - "main"
      - "master"
      - "hotfix/**"
      - "release/**"
      - "develop"
      - "feature/**"
    paths:
      - "**/*.sh"
      - "**/*.bats"

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  shell-script-ci:
    uses: y-miyazaki/config/.github/workflows/ci-shell-script.yaml@6999326668f0c265187bf30bacca76a19ecebc74 # v1.9.7

    with:
      script_path: "**/*.sh,**/*.bats"
    permissions:
      checks: write
      contents: read
      pull-requests: write
