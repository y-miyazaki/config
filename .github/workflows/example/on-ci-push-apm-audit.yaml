# CI workflow: APM install and audit on push/PR
name: on-ci-push-apm-audit

run-name: "${{ github.workflow }} (${{ github.event_name }})"

on:
  push:
    branches:
      - "main"
      - "master"
      - "hotfix/**"
      - "release/**"
      - "develop"
      - "feature/**"
    paths:
      - ".apm/**"
      - ".agents/**"
      - ".github/**"
      - "apm.lock.yaml"
      - "apm.yml"
  pull_request:
    branches:
      - "main"
      - "master"
      - "hotfix/**"
      - "release/**"
      - "develop"
      - "feature/**"
    paths:
      - ".apm/**"
      - ".agents/**"
      - ".github/**"
      - "apm.lock.yaml"
      - "apm.yml"

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  apm-audit:
    uses: y-miyazaki/config/.github/workflows/ci-apm-audit.yaml@391d87540b62b2711a656aba584f96013d689671 # v1.8.108
    with:
      # Set true only when installed trees must match APM sources exactly.
      check_drift: false
    permissions:
      contents: read
