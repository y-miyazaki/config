# CI workflow: APM install and audit on push/PR
name: on-ci-push-apm-audit

on:
  push:
    branches:
      - "main"
      - "master"
      - "hotfix/**"
      - "release/**"
      - "develop"
      - "feature/**"
    paths:
      - ".apm/**"
      - ".agents/**"
      - ".github/**"
      - "apm.lock.yaml"
      - "apm.yml"
  pull_request:
    branches:
      - "main"
      - "master"
      - "hotfix/**"
      - "release/**"
      - "develop"
      - "feature/**"
    paths:
      - ".apm/**"
      - ".agents/**"
      - ".github/**"
      - "apm.lock.yaml"
      - "apm.yml"

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  apm-audit:
    uses: y-miyazaki/config/.github/workflows/ci-apm-audit.yaml@0d6469d1fccff1d211f9294bd261a6b5f6f3e4bf # v1.8.74
    with:
      # Set true only when installed trees must match APM sources exactly.
      check_drift: false
    permissions:
      contents: read
