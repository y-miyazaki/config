#######################################
# Description:
#   Manual workflow: ECS deployment (application, dev)
#
# Usage:
#   Copy to .github/workflows/ in your repository and adjust the with: values.
#   Runs on: workflow_dispatch
#
# Design Rules:
#   None
#
# Dependencies:
#   None
#
# References:
#   None
#######################################
name: on-cd-wd-application-ecs-dev

run-name: "${{ github.workflow }} (${{ github.event_name }})"

on:
  workflow_dispatch: # Manual deployment workflow

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  ecs-deploy:
    permissions:
      contents: read
      id-token: write
    uses: y-miyazaki/config/.github/workflows/cd-aws-ecs.yaml@9a4ee6efc109067a78742b34cd1cf617c7f80ad5 # v1.9.5

    with:
      ecs_service_base_dir: "ecs/ecs-service/test-server"
      environment: "dev"
    secrets:
      AWS_IAM_ROLE_ARN: ${{ secrets.AWS_IAM_ROLE_ARN }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
