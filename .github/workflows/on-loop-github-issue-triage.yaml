#######################################
# Description:
#   Loop workflow: Issue triage (entity / L1)
#   Daily schedule lists open triage candidates and fans out one run per Issue.
#
# Usage:
#   Runs on: issues, issue_comment, schedule, workflow_dispatch
#
# Design Rules:
#   None
#
# Dependencies:
#   - Requires repository secret: AGENT_TOKEN (engine API key).
#
# References:
#   - Design: docs/explanation/loop-engineering/workflows/loop-github-issue-triage-workflow-design.md
#   - Spec: docs/superpowers/specs/2026-08-11-issue-triage-entity-loops-design.md
#######################################
name: on-loop-github-issue-triage

run-name: "${{ github.workflow }} ${{ github.event.issue.number && format('#{0}', github.event.issue.number) || inputs.issue_number && format('#{0}', inputs.issue_number) || github.event_name }}"

on:
  issues:
    types: [opened, reopened, labeled]
  issue_comment: # zizmor: ignore[dangerous-triggers]
    types: [created]
  schedule:
    - cron: "0 7 * * *"
      timezone: Etc/UTC
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to triage
        required: true
        type: number

permissions: {}

concurrency:
  cancel-in-progress: false
  group: ${{ github.event_name == 'schedule' && 'loop-state-main' || format('loop-github-issue-triage-{0}', github.event.issue.number || inputs.issue_number || github.run_id) }}
  queue: max

jobs:
  list:
    if: github.event_name == 'schedule'
    outputs:
      count: ${{ steps.list.outputs.count }}
      issues: ${{ steps.list.outputs.issues }}
    permissions:
      contents: read
      issues: read
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: List triage Issues
        id: list
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/self/loop/list_triage_issues.sh
  loop:
    # Intake gate mirrors detect_issue.sh should_skip_issue so loop-authored
    # side effects never re-enter the queue: finalize posts the comment and
    # applies labels with a GitHub App token, which (unlike GITHUB_TOKEN) does
    # raise new webhooks. Bot senders and triage:failed are refused here, not in
    # detect, so no run is queued behind the in-flight one.
    # Label allowlist is intake-only — classification labels the agent itself
    # applies (bug/feature/question/documentation) must stay out, and so must
    # triage:ready (detect skips it, so admitting it only queues skipped runs).
    # autofix is owned by on-loop-github-issue-autofix.yaml and must not
    # double-intake here.
    # loop:code-review Issues are findings filed by the code-review loop; the
    # issues webhook refuses them so they are not triaged as user reports.
    # Schedule intake is gated by the list job (count > 0), not by this mirror.
    if: >-
      !cancelled() &&
      (needs.list.result == 'success' || needs.list.result == 'skipped') &&
      (
        (github.event_name == 'schedule' && needs.list.outputs.count > 0) ||
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'issues' &&
          github.event.sender.type != 'Bot' &&
          !contains(github.event.issue.labels.*.name, 'triage:failed') &&
          !contains(github.event.issue.labels.*.name, 'loop:code-review') &&
          (
            github.event.repository.private == true ||
            (
              contains(fromJSON('["opened","reopened"]'), github.event.action) &&
              contains(fromJSON('["MEMBER","OWNER","COLLABORATOR"]'), github.event.issue.author_association)
            ) ||
            (
              github.event.action == 'labeled' &&
              (
                github.event.sender.login == github.repository_owner ||
                (
                  github.event.sender.login == github.event.issue.user.login &&
                  contains(fromJSON('["MEMBER","OWNER","COLLABORATOR"]'), github.event.issue.author_association)
                )
              )
            )
          ) &&
          (
            contains(fromJSON('["opened","reopened"]'), github.event.action) ||
            (
              github.event.action == 'labeled' &&
              contains(
                fromJSON('["needs-triage","triage:needs-info"]'),
                github.event.label.name
              )
            )
          )
        ) ||
        (
          github.event_name == 'issue_comment' &&
          github.event.issue.pull_request == null &&
          github.event.sender.type != 'Bot' &&
          github.event.comment.user.type != 'Bot' &&
          contains(github.event.issue.labels.*.name, 'triage:needs-info') &&
          !contains(github.event.issue.labels.*.name, 'triage:failed') &&
          (
            github.event.repository.private == true ||
            contains(fromJSON('["MEMBER","OWNER","COLLABORATOR"]'), github.event.comment.author_association)
          )
        )
      )
    needs: list
    permissions:
      actions: write
      contents: write
      copilot-requests: write # zizmor: ignore[excessive-permissions]
      issues: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        issue: ${{ fromJSON(needs.list.outputs.issues || format('[{0}]', github.event.issue.number || inputs.issue_number || 0)) }}
      max-parallel: 3
    uses: ./.github/workflows/ci-loop-caller-entity.yaml
    with:
      agent_checker_effort: medium
      agent_checker_instructions: |
        ## Criteria for APPROVE

        ALL of the following must be true:
        1. Only allowlisted labels from github-issue-triage labels.json were applied
        2. Low-confidence cases keep needs-triage and include clarifying questions on the Issue
        3. No repository file edits when agent_edit_allowed is false
        4. No PR opened by the Agent; Agent did not call repository_dispatch
        5. Bot-authored events were skipped (no mutations)

        ## Criteria for REJECT

        ANY of the following triggers REJECT:
        - Non-allowlisted labels applied
        - Repository files modified under agent_edit_allowed false
        - Agent attempted repository_dispatch, PR creation, or autofix execute
        - Question self-censorship (needed questions omitted with no needs-info path)
      agent_checker_max_turns: 100
      agent_checker_model: claude-opus-5
      agent_engine: claude
      agent_loop_max_attempts: 3
      agent_maker_effort: medium
      agent_maker_instructions: |
        Triage the Issue per the github-issue-triage skill.
        Do NOT post comments or change labels. Write the comment markdown to message.md, and the
        label changes as {"add":[...],"remove":[...]} to message_labels.json, in the loop message
        directory named at the end of this prompt. The comment has no preamble, no status line, and
        no leading "---". Do not open PRs or call repository_dispatch.
      agent_maker_max_turns: 100
      agent_maker_model: claude-sonnet-5
      agent_maker_skill_name: github-issue-triage
      # Triage reads Issue facts only; finalize posts the comment and applies the
      # labels. CI never activates the host .claude/settings.json allow rules (no
      # workspace trust), so these rules plus the platform read-only git baseline
      # are the agent's whole command surface; the platform deny list blocks gh writes.
      agent_tool_allowlist: |
        Bash(gh api -X GET:*)
        Bash(gh issue view:*)
        Bash(gh label list:*)
        Bash(gh repo view:*)
      budget_max_runs_per_day: 20
      budget_max_tokens_per_day: 1000000
      delivery: issue_comment
      detect_env_json: ${{ github.event_name == 'schedule' && format('{{"ISSUE_EVENT_NAME":"schedule","ISSUE_NUMBER":{0}}}', toJSON(matrix.issue)) || github.event_name == 'workflow_dispatch' && format('{{"ISSUE_NUMBER":{0}}}', toJSON(matrix.issue)) || '{}' }}
      detect_script: .agents/skills/github-issue-triage/scripts/detect_issue.sh
      finalize_label_allowlist: |
        needs-triage
        bug
        feature
        question
        documentation
        triage:needs-info
        triage:ready
        triage:failed
      handoff_artifact_suffix: -issue-${{ matrix.issue }}
      level: L1
      loop_name: github-issue-triage
      state_branch: main
    secrets:
      AGENT_TOKEN: ${{ secrets.AGENT_TOKEN }}
      BOT_APP_CLIENT_ID: ${{ secrets.MAINTENANCE_BOT_APP_CLIENT_ID }}
      BOT_APP_PRIVATE_KEY: ${{ secrets.MAINTENANCE_BOT_APP_PRIVATE_KEY }}
