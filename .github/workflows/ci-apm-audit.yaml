# Reusable workflow: APM install and audit
# Installs the pinned APM CLI, runs apm install, and validates with apm audit.
name: ci-apm-audit

on:
  workflow_call:
    inputs:
      apm_version:
        default: "v0.28.0"
        description: "APM CLI version to use"
        required: false
        type: string
      check_drift:
        default: false
        description: "When true, apm audit includes drift detection (omit --no-drift). When false, drift from APM-managed vs installed trees is ignored."
        required: false
        type: boolean
      policy_org:
        default: false
        description: "Run organization policy check (apm audit --policy org)"
        required: false
        type: boolean
      policy_path:
        default: ""
        description: "Optional APM policy file or policy name"
        required: false
        type: string

permissions:
  contents: read

env:
  APM_VERSION: ${{ inputs.apm_version }}
  CHECK_DRIFT: ${{ inputs.check_drift }}
  POLICY_ORG: ${{ inputs.policy_org }}
  POLICY_PATH: ${{ inputs.policy_path }}

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # prettier-ignore
      - name: Install APM CLI
        shell: bash
        run: | # nosemgrep: yaml.github-actions.security.gha-curl-pipe-shell.gha-curl-pipe-shell
          set -euo pipefail
          # Official APM installer from Microsoft; trusted endpoint in CI only.
          curl -fsSL https://aka.ms/apm-unix | sh -s -- "@${APM_VERSION}"

      - name: Install APM packages
        shell: bash
        run: |
          set -euo pipefail
          apm install

      - name: Baseline checks
        shell: bash
        run: |
          set -euo pipefail
          drift_args=()
          if [[ "${CHECK_DRIFT}" != "true" ]]; then
            drift_args+=(--no-drift)
          fi
          apm audit --ci "${drift_args[@]}" --no-cache

      - name: Policy checks(org)
        if: ${{ inputs.policy_org && inputs.policy_path == '' }}
        shell: bash
        run: |
          set -euo pipefail
          drift_args=()
          if [[ "${CHECK_DRIFT}" != "true" ]]; then
            drift_args+=(--no-drift)
          fi
          apm audit --ci "${drift_args[@]}" --no-cache --policy org
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Policy checks(custom)
        if: ${{ inputs.policy_path != '' }}
        shell: bash
        run: |
          set -euo pipefail
          drift_args=()
          if [[ "${CHECK_DRIFT}" != "true" ]]; then
            drift_args+=(--no-drift)
          fi
          apm audit --ci "${drift_args[@]}" --no-cache --policy "${POLICY_PATH}"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Summary
        if: always()
        uses: y-miyazaki/config/.github/actions/summary@9513f47e9fb5a367fbd8abefdc73895737b62e03 # v1.8.86
        with:
          artifacts: |
            (none)
          params: |
            apm_version: ${{ env.APM_VERSION }}
            check_drift: ${{ env.CHECK_DRIFT }}
            policy_org: ${{ env.POLICY_ORG }}
            policy_path: ${{ env.POLICY_PATH }}
          status: "${{ job.status }}"
          title: "APM Audit"
