# Reusable workflow: Terraform CI (fmt, validate, tflint) without AWS credentials
# For plan/apply with remote state, use ci-aws-terraform. For Trivy/SBOM, use ci-security.
name: ci-terraform

on:
  workflow_call:
    inputs:
      modules_path:
        default: ""
        description: "Optional modules directory for additional TFLint passes (empty to skip)"
        required: false
        type: string
      recursive:
        default: true
        description: "When true, validate every directory containing main.tf under terraform_path"
        required: false
        type: boolean
      terraform_path:
        default: .
        description: "Root directory to scan or validate when recursive is false"
        required: false
        type: string
      terraform_version:
        default: "1.15.8"
        description: "Terraform version to use"
        required: false
        type: string
      tflint_config_path:
        default: ""
        description: "TFLint config file path (default: auto-detect .tflint.hcl in terraform_path or repository root)"
        required: false
        type: string
      tflint_version:
        default: "v0.64.0"
        description: "TFLint version to use"
        required: false
        type: string

permissions:
  contents: read

env:
  MODULES_PATH: ${{ inputs.modules_path }}
  RECURSIVE: ${{ inputs.recursive }}
  TERRAFORM_PATH: ${{ inputs.terraform_path }}
  TERRAFORM_VERSION: ${{ inputs.terraform_version }}
  TFLINT_CONFIG_PATH: ${{ inputs.tflint_config_path }}
  TFLINT_VERSION: ${{ inputs.tflint_version }}

jobs:
  lint:
    if: ${{ github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Resolve module directories
        id: modules
        shell: bash
        run: |
          set -euo pipefail
          scan_root="${TERRAFORM_PATH:-.}"
          if [[ "${RECURSIVE}" == "true" ]]; then
            mapfile -t module_dirs < <(
              find "${scan_root}" ! -path '*/.terraform/*' -type f -name 'main.tf' -exec dirname {} \; | sort -u
            )
          elif [[ -f "${scan_root}/main.tf" ]]; then
            module_dirs=("${scan_root}")
          else
            module_dirs=()
          fi

          if [[ ${#module_dirs[@]} -eq 0 ]]; then
            echo "No Terraform modules found under ${scan_root}" >&2
            exit 1
          fi

          printf '%s\n' "${module_dirs[@]}" > /tmp/terraform_module_dirs.txt
          echo "count=${#module_dirs[@]}" >> "${GITHUB_OUTPUT}"

      - name: Exec Terraform fmt check
        shell: bash
        run: |
          set -euo pipefail
          terraform fmt -check -recursive "${TERRAFORM_PATH}"

      - name: Exec Terraform init and validate
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r module_dir; do
            [[ -z "${module_dir}" ]] && continue
            echo "Validating ${module_dir}"
            terraform -chdir="${module_dir}" init -backend=false -reconfigure
            terraform -chdir="${module_dir}" validate
          done < /tmp/terraform_module_dirs.txt

      - name: Resolve TFLint config path
        id: tflint-config
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${TFLINT_CONFIG_PATH}" ]; then
            if [ -f "${TFLINT_CONFIG_PATH}" ]; then
              echo "path=$(realpath "${TFLINT_CONFIG_PATH}")" >> "${GITHUB_OUTPUT}"
            elif [ -f "${GITHUB_WORKSPACE}/${TFLINT_CONFIG_PATH}" ]; then
              echo "path=$(realpath "${GITHUB_WORKSPACE}/${TFLINT_CONFIG_PATH}")" >> "${GITHUB_OUTPUT}"
            else
              echo "TFLINT_CONFIG_PATH not found: ${TFLINT_CONFIG_PATH}" >&2
              exit 1
            fi
          elif [ -f "${TERRAFORM_PATH}/.tflint.hcl" ]; then
            echo "path=$(realpath "${TERRAFORM_PATH}/.tflint.hcl")" >> "${GITHUB_OUTPUT}"
          elif [ -f ".tflint.hcl" ]; then
            echo "path=$(realpath ".tflint.hcl")" >> "${GITHUB_OUTPUT}"
          else
            echo "path=" >> "${GITHUB_OUTPUT}"
          fi

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
        with:
          cache: true
          tflint_config_path: ${{ steps.tflint-config.outputs.path }}
          tflint_version: ${{ env.TFLINT_VERSION }}

      - name: Exec TFLint
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${TFLINT_RESOLVED_CONFIG}" ]; then
            tflint --init --config "${TFLINT_RESOLVED_CONFIG}"
          else
            tflint --init
          fi

          while IFS= read -r module_dir; do
            [[ -z "${module_dir}" ]] && continue
            args=(-f compact --chdir "${module_dir}")
            if [ -f "${module_dir}/.tflint.hcl" ]; then
              args+=(--config "$(realpath "${module_dir}/.tflint.hcl")")
            elif [ -n "${TFLINT_RESOLVED_CONFIG}" ]; then
              args+=(--config "${TFLINT_RESOLVED_CONFIG}")
            fi
            tflint "${args[@]}"
          done < /tmp/terraform_module_dirs.txt

          if [ -n "${MODULES_PATH}" ] && [ -d "${MODULES_PATH}" ]; then
            root_config="${TFLINT_RESOLVED_CONFIG}"
            if [ -z "${root_config}" ] && [ -f ".tflint.hcl" ]; then
              root_config="$(realpath ".tflint.hcl")"
            fi
            while IFS= read -r dir; do
              module_args=(-f compact --chdir "$dir")
              if [ -f "${dir}/.tflint.hcl" ]; then
                module_args+=(--config "$(realpath "${dir}/.tflint.hcl")")
              elif [ -n "${root_config}" ]; then
                module_args+=(--config "${root_config}")
              fi
              tflint --init "${module_args[@]}" > /dev/null 2>&1 || true
              tflint "${module_args[@]}"
            done < <(find "${MODULES_PATH}" -name "*.tf" -exec dirname {} \; | sort -u)
          fi
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TFLINT_RESOLVED_CONFIG: ${{ steps.tflint-config.outputs.path }}

      - name: Summary
        if: always()
        uses: y-miyazaki/config/.github/actions/summary@e72b22706bf5284c03b5c33843e22059f370511e # v1.8.91
        with:
          artifacts: |
            (none)
          params: |
            module_count: ${{ steps.modules.outputs.count }}
            recursive: ${{ env.RECURSIVE }}
            terraform_path: ${{ env.TERRAFORM_PATH }}
            tflint_version: ${{ env.TFLINT_VERSION }}
          status: "${{ job.status }}"
          title: "Terraform CI"
