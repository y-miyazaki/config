# Reusable workflow: Loop agent execution
# L1: agent-l1 (loop-agent-once) → finalize-l1 (run-log; future L1 delivery)
# L2/L3: agent-l2 (loop-execute) → finalize-l2 (run-log always; loop-finalize when finalize_enabled)
# finalize_enabled gates git landing / PR inside finalize-l2, not whether finalize runs.
# Caller-facing prompts: loop-detect assembles maker text (prompt_text); domain checker rubric is agent_checker_instructions.
# Checker prompt scaffolding (INITIAL/REGRESSION, output contract) is owned by loop-execute — not workflow_call inputs here.
# Contract (L2/L3): outputs { branch, has_changes, verdict, reason, attempts }
# Token resolution: resolve inside each job (agent-l1 / agent-l2 / finalize-l1 / finalize-l2); pass BOT_APP_* + optional GH_TOKEN.
# Do not accept a pre-resolved token via workflow_call secrets named GITHUB_TOKEN (reserved).
#   docs/explanation/loop-engineering/loop-caller-reusable-design.md#github-token-resolution
name: ci-loop-agent

on:
  workflow_call:
    inputs:
      additional_commit_paths:
        default: ""
        description: "Comma-separated paths to commit with state after domain persistence"
        required: false
        type: string
      agent_checker_instructions:
        default: ""
        description: "Domain-specific APPROVE/REJECT criteria (L2/L3)"
        required: false
        type: string
      agent_checker_max_turns:
        default: 3
        description: "Maximum checker agent turns (L2/L3)"
        required: false
        type: number
      agent_checker_model:
        default: ""
        description: "Checker model override (L2/L3)"
        required: false
        type: string
      agent_checker_skill_name:
        default: ""
        description: "Checker skill name passed to loop-execute"
        required: false
        type: string
      agent_loop_max_attempts:
        default: 3
        description: "Maximum Agent→Verify loop attempts (L2/L3)"
        required: false
        type: number
      agent_maker_max_turns:
        default: 5
        description: "Maximum maker agent turns per loop attempt"
        required: false
        type: number
      agent_maker_model:
        default: ""
        description: "Maker model override"
        required: false
        type: string
      agent_maker_skill_name:
        default: ""
        description: "Skill name (used for L2 branch naming)"
        required: false
        type: string
      allowlist:
        default: ""
        description: "Comma-separated glob allowlist for checker (L2/L3)"
        required: false
        type: string
      auto_merge:
        default: "false"
        description: "Enable auto-merge on created PR (finalize job; L3 + open_pr only)"
        required: false
        type: string
      base_branch:
        default: "main"
        description: "Base branch for verify diff (L2/L3)"
        required: false
        type: string
      branch_prefix:
        default: "loop"
        description: "Worktree branch prefix (L2/L3)"
        required: false
        type: string
      cli_version:
        default: "latest"
        description: "CLI agent version"
        required: false
        type: string
      commit_message:
        default: "chore: loop-automated update"
        description: "Commit message prefix for loop attempts (L2/L3)"
        required: false
        type: string
      current_sha:
        default: ""
        description: "SHA to record in per-target state (finalize job)"
        required: false
        type: string
      denylist:
        default: "**/.env,**/credentials*,**/secrets*,**/migration/*.sql,**/infrastructure/**"
        description: "Comma-separated path denylist for checker (L2/L3)"
        required: false
        type: string
      detect_result_json:
        default: "{}"
        description: "Detect script JSON result for notify_context_json (L2/L3)"
        required: false
        type: string
      domain_persistence_script:
        default: ""
        description: "Optional bash script for domain ledger persistence (finalize job)"
        required: false
        type: string
      engine:
        description: "AI engine (claude | copilot | codex | cursor)"
        required: true
        type: string
      environment:
        default: default
        description: "GitHub environment for maintenance bot secrets"
        required: false
        type: string
      finalize_enabled:
        default: false
        description: "Run loop-finalize git landing/PR inside finalize-l2 (not whether finalize-l2 runs)"
        required: false
        type: boolean
      handoff_artifact_name:
        default: ""
        description: "loop-handoff artifact name from loop-detect"
        required: false
        type: string
      handoff_key:
        default: ""
        description: "Target handoff key for artifact payload resolution"
        required: false
        type: string
      infer_files_pattern:
        default: ""
        description: "Optional extended-regex to infer file paths from checker text (L2/L3)"
        required: false
        type: string
      labels:
        default: "loop-automation"
        description: "Comma-separated labels for created PR (finalize job)"
        required: false
        type: string
      level:
        default: "L1"
        description: "Loop level: L1 (read-only), L2 (edits with branch), or L3 (edits with auto-merge)"
        required: false
        type: string
      loop_name:
        description: "Loop identifier for state, budget, and run-log"
        required: true
        type: string
      no_changes_verdict:
        default: "APPROVE"
        description: "Verdict when maker produces no file changes (APPROVE or REJECT, L2/L3)"
        required: false
        type: string
      outcome_override:
        default: ""
        description: "Optional explicit finalize outcome (e.g. watch)"
        required: false
        type: string
      pr_body:
        default: ""
        description: "PR body text for finalize job"
        required: false
        type: string
      pr_draft:
        default: false
        description: "Create finalize PR as draft when true"
        required: false
        type: boolean
      pr_title:
        default: ""
        description: "PR title for finalize job"
        required: false
        type: string
      prompt_text:
        default: ""
        description: "Maker prompt from loop-detect (matrix.target.prompt) or direct L1 invocation"
        required: false
        type: string
      run_log_file:
        default: .loop/loop-run-log.md
        description: "JSONL run log path for budget aggregation (finalize job)"
        required: false
        type: string
      run_started_at:
        default: ""
        description: "Workflow run start timestamp for run log (finalize job)"
        required: false
        type: string
      skip_reason:
        default: "none"
        description: "Detect skip reason recorded in run log (finalize job)"
        required: false
        type: string
      state_file:
        default: ""
        description: "Loop state file path (L2/L3)"
        required: false
        type: string
      state_push_branch:
        default: ""
        description: "Branch for .loop/* state commits (L2/L3)"
        required: false
        type: string
      target_json:
        default: ""
        description: "Target descriptor from loop-detect matrix cell (L2/L3)"
        required: false
        type: string
      verifier_context:
        default: ""
        description: "Additional checker context such as CI logs or lint output (L2/L3)"
        required: false
        type: string
    outputs:
      attempts:
        description: "Number of Agent→Verify attempts (L2/L3)"
        value: ${{ jobs.agent-l2.outputs.attempts || '0' }}
      branch:
        description: "Branch with changes (L2 only, empty if L1 or no changes)"
        value: ${{ jobs.agent-l2.outputs.branch || '' }}
      has_changes:
        description: "Whether agent produced file changes (L2 only)"
        value: ${{ jobs.agent-l2.outputs.has_changes || 'false' }}
      open_rejections:
        description: "JSON array of unresolved structured rejections (L2/L3)"
        value: ${{ jobs.agent-l2.outputs.open_rejections || '[]' }}
      outcome_override:
        description: "Optional finalize outcome from Skill deferral (e.g. watch)"
        value: ${{ jobs.agent-l2.outputs.outcome_override || '' }}
      reason:
        description: "Final checker reason (L2/L3)"
        value: ${{ jobs.agent-l2.outputs.reason || '' }}
      usage_json:
        description: "Measured token usage JSON (L1 from agent-l1, L2/L3 from agent-l2)"
        value: ${{ jobs.agent-l1.outputs.usage_json || jobs.agent-l2.outputs.usage_json || '' }}
      verdict:
        description: "Final checker verdict APPROVE/REJECT (L2/L3)"
        value: ${{ jobs.agent-l2.outputs.verdict || '' }}
    secrets:
      AGENT_TOKEN:
        description: "Authentication token for the selected engine"
        required: true
      BOT_APP_CLIENT_ID:
        description: "GitHub App client ID for ruleset-bypass .loop/* pushes"
        required: false
      BOT_APP_PRIVATE_KEY:
        description: "GitHub App private key for ruleset-bypass .loop/* pushes"
        required: false
      GH_TOKEN:
        description: "Optional explicit GitHub token (App → GH_TOKEN → job GITHUB_TOKEN)"
        required: false

permissions:
  contents: read
  copilot-requests: write # zizmor: ignore[excessive-permissions]

defaults:
  run:
    shell: bash

jobs:
  agent-l1:
    if: inputs.level == 'L1'
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      usage_json: ${{ steps.agent.outputs.usage_json }}
    permissions:
      contents: read
      copilot-requests: write # zizmor: ignore[excessive-permissions]
      issues: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve GitHub Token
        id: resolve_github_token
        uses: y-miyazaki/config/.github/actions/loop-resolve-push-token@b95e510f2fc24d65f4e92846123eaf2e7cb49c0b # v1.8.97
        with:
          bot_app_client_id: ${{ secrets.BOT_APP_CLIENT_ID }}
          bot_app_private_key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          github_token: ${{ secrets.GH_TOKEN }}

      - name: Run Agent Once
        id: agent
        uses: y-miyazaki/config/.github/actions/loop-agent-once@b95e510f2fc24d65f4e92846123eaf2e7cb49c0b # v1.8.97
        with:
          agent_token: ${{ secrets.AGENT_TOKEN }}
          cli_version: ${{ inputs.cli_version }}
          engine: ${{ inputs.engine }}
          github_token: ${{ steps.resolve_github_token.outputs.github_token }}
          max_turns: ${{ format('{0}', inputs.agent_maker_max_turns) }}
          model: ${{ inputs.agent_maker_model }}
          prompt_text: ${{ inputs.prompt_text }}

  finalize-l1:
    if: >-
      always() &&
      inputs.level == 'L1' &&
      needs.agent-l1.result != 'cancelled' &&
      needs.agent-l1.result != 'skipped'
    needs: agent-l1
    environment: ${{ inputs.environment }}
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve GitHub Token
        id: resolve_github_token
        uses: y-miyazaki/config/.github/actions/loop-resolve-push-token@b95e510f2fc24d65f4e92846123eaf2e7cb49c0b # v1.8.97
        with:
          bot_app_client_id: ${{ secrets.BOT_APP_CLIENT_ID }}
          bot_app_private_key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          github_token: ${{ secrets.GH_TOKEN }}

      - name: Append Run Log
        uses: y-miyazaki/config/.github/actions/loop-run-log@b95e510f2fc24d65f4e92846123eaf2e7cb49c0b # v1.8.97
        with:
          agent_result: ${{ needs.agent-l1.result }}
          base_branch: ${{ inputs.state_push_branch != '' && inputs.state_push_branch || inputs.base_branch }}
          github_token: ${{ steps.resolve_github_token.outputs.github_token }}
          has_changes: "false"
          loop_name: ${{ inputs.loop_name }}
          outcome: ${{ needs.agent-l1.result == 'success' && 'no-changes' || 'error' }}
          run_log_file: ${{ inputs.run_log_file }}
          run_started_at: ${{ inputs.run_started_at }}
          skip_reason: ${{ inputs.skip_reason }}
          usage_json: ${{ needs.agent-l1.outputs.usage_json || '' }}

  agent-l2:
    if: inputs.level == 'L2' || inputs.level == 'L3'
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      attempts: ${{ steps.execute.outputs.attempts }}
      branch: ${{ steps.worktree.outputs.branch }}
      failure_message: ${{ steps.execute.outputs.failure_message }}
      failure_stage: ${{ steps.execute.outputs.failure_stage }}
      has_changes: ${{ steps.execute.outputs.has_changes }}
      notify_context_json: ${{ steps.execute.outputs.notify_context_json }}
      open_rejections: ${{ steps.execute.outputs.open_rejections }}
      outcome_override: ${{ steps.execute.outputs.outcome_override }}
      reason: ${{ steps.execute.outputs.reason }}
      usage_json: ${{ steps.execute.outputs.usage_json }}
      verdict: ${{ steps.execute.outputs.verdict }}
    permissions:
      actions: read
      contents: write
      copilot-requests: write # zizmor: ignore[excessive-permissions]
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download Loop Handoff
        if: inputs.handoff_artifact_name != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.handoff_artifact_name }}
          path: ${{ runner.temp }}/loop-handoff

      - name: Resolve GitHub Token
        id: resolve_github_token
        uses: y-miyazaki/config/.github/actions/loop-resolve-push-token@b95e510f2fc24d65f4e92846123eaf2e7cb49c0b # v1.8.97
        with:
          bot_app_client_id: ${{ secrets.BOT_APP_CLIENT_ID }}
          bot_app_private_key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          github_token: ${{ secrets.GH_TOKEN }}

      - name: Parse Target
        id: target
        env:
          BASE_BRANCH: ${{ inputs.base_branch }}
          TARGET_JSON: ${{ inputs.target_json }}
        run: |
          set -euo pipefail
          if [[ -n "${TARGET_JSON}" ]] && jq -e . >/dev/null 2>&1 <<< "${TARGET_JSON}"; then
            {
              echo "worktree_branch=$(jq -r '.from.branch' <<< "${TARGET_JSON}")"
              echo "worktree_ref=$(jq -r '.from.ref' <<< "${TARGET_JSON}")"
              echo "verify_base_branch=$(jq -r 'if .mode == "pull_request" then .base.branch else .to.branch end' <<< "${TARGET_JSON}")"
              echo "target_key=$(jq -r '.key' <<< "${TARGET_JSON}")"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "worktree_branch=${BASE_BRANCH}"
              echo "worktree_ref="
              echo "verify_base_branch=${BASE_BRANCH}"
              echo "target_key=integration:${BASE_BRANCH}"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Worktree
        id: worktree
        uses: y-miyazaki/config/.github/actions/loop-worktree-setup@b95e510f2fc24d65f4e92846123eaf2e7cb49c0b # v1.8.97
        with:
          agent_maker_skill_name: ${{ inputs.agent_maker_skill_name }}

          base_branch: ${{ steps.target.outputs.worktree_branch }}
          base_ref: ${{ steps.target.outputs.worktree_ref }}
          branch_prefix: ${{ inputs.branch_prefix }}
          github_token: ${{ steps.resolve_github_token.outputs.github_token }}
      - name: Execute Bounded Loop
        id: execute
        uses: y-miyazaki/config/.github/actions/loop-execute@b95e510f2fc24d65f4e92846123eaf2e7cb49c0b # v1.8.97
        with:
          agent_checker_instructions: ${{ inputs.agent_checker_instructions }}
          agent_checker_max_turns: ${{ format('{0}', inputs.agent_checker_max_turns) }}
          agent_checker_model: ${{ inputs.agent_checker_model }}
          agent_checker_skill_name: ${{ inputs.agent_checker_skill_name }}
          agent_loop_max_attempts: ${{ format('{0}', inputs.agent_loop_max_attempts) }}
          agent_maker_max_turns: ${{ format('{0}', inputs.agent_maker_max_turns) }}
          agent_maker_model: ${{ inputs.agent_maker_model }}
          agent_maker_skill_name: ${{ inputs.agent_maker_skill_name }}
          agent_token: ${{ secrets.AGENT_TOKEN }}
          allowlist: ${{ inputs.allowlist }}
          base_branch: ${{ steps.target.outputs.verify_base_branch }}
          branch: ${{ steps.worktree.outputs.branch }}
          cli_version: ${{ inputs.cli_version }}
          commit_message: ${{ inputs.commit_message }}
          denylist: ${{ inputs.denylist != '' && inputs.denylist || '**/.env,**/credentials*,**/secrets*,**/migration/*.sql,**/infrastructure/**' }}
          detect_result_json: ${{ inputs.detect_result_json }}
          engine: ${{ inputs.engine }}
          github_token: ${{ steps.resolve_github_token.outputs.github_token }}
          handoff_dir: ${{ runner.temp }}/loop-handoff
          handoff_key: ${{ inputs.handoff_key != '' && inputs.handoff_key || steps.target.outputs.target_key }}
          infer_files_pattern: ${{ inputs.infer_files_pattern }}
          no_changes_verdict: ${{ inputs.no_changes_verdict }}
          prompt_text: ${{ inputs.prompt_text }}
          verifier_context: ${{ inputs.verifier_context }}
          worktree_path: ${{ steps.worktree.outputs.worktree_path }}

  finalize-l2:
    if: >-
      always() &&
      (inputs.level == 'L2' || inputs.level == 'L3') &&
      needs.agent-l2.result != 'cancelled' &&
      needs.agent-l2.result != 'skipped'
    needs: agent-l2
    environment: ${{ inputs.environment }}
    permissions:
      actions: read
      contents: write
      pull-requests: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download Loop Handoff
        if: inputs.handoff_artifact_name != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.handoff_artifact_name }}
          path: ${{ runner.temp }}/loop-handoff

      - name: Parse Notify Target
        id: notify_target
        env:
          TARGET_JSON: ${{ inputs.target_json }}
        run: |
          set -euo pipefail
          if [[ -n "${TARGET_JSON}" ]] && jq -e . >/dev/null 2>&1 <<< "${TARGET_JSON}"; then
            echo "pr_number=$(jq -r '.to.pr_number // empty' <<< "${TARGET_JSON}")" >> "$GITHUB_OUTPUT"
          else
            echo "pr_number=" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve GitHub Token
        id: resolve_github_token
        uses: y-miyazaki/config/.github/actions/loop-resolve-push-token@b95e510f2fc24d65f4e92846123eaf2e7cb49c0b # v1.8.97
        with:
          bot_app_client_id: ${{ secrets.BOT_APP_CLIENT_ID }}
          bot_app_private_key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          github_token: ${{ secrets.GH_TOKEN }}

      - name: Finalize
        if: inputs.finalize_enabled
        continue-on-error: true
        id: finalize
        uses: y-miyazaki/config/.github/actions/loop-finalize@b95e510f2fc24d65f4e92846123eaf2e7cb49c0b # v1.8.97
        with:
          additional_commit_paths: ${{ inputs.additional_commit_paths }}
          agent_result: ${{ needs.agent-l2.result }}
          auto_merge: ${{ inputs.auto_merge }}
          base_branch: ${{ inputs.base_branch }}
          branch: ${{ needs.agent-l2.outputs.branch }}
          current_sha: ${{ inputs.current_sha }}
          detect_result_json: ${{ inputs.detect_result_json }}
          domain_persistence_script: ${{ inputs.domain_persistence_script }}
          engine: ${{ inputs.engine }}
          execute_branch: ${{ needs.agent-l2.outputs.branch }}
          github_token: ${{ steps.resolve_github_token.outputs.github_token }}
          handoff_dir: ${{ runner.temp }}/loop-handoff
          handoff_key: ${{ inputs.handoff_key }}
          has_changes: ${{ needs.agent-l2.outputs.has_changes }}
          labels: ${{ inputs.labels }}
          level: ${{ inputs.level }}
          loop_name: ${{ inputs.loop_name }}
          notify_context_json: ${{ needs.agent-l2.outputs.notify_context_json || '{}' }}
          open_rejections: ${{ needs.agent-l2.outputs.open_rejections }}
          outcome_override: ${{ inputs.outcome_override != '' && inputs.outcome_override || needs.agent-l2.outputs.outcome_override }}
          pr_body: ${{ inputs.pr_body }}
          pr_draft: ${{ inputs.pr_draft == true && 'true' || 'false' }}
          pr_title: ${{ inputs.pr_title }}
          reject_reason: ${{ needs.agent-l2.outputs.reason }}
          skip_reason: ${{ inputs.skip_reason }}
          state_file: ${{ inputs.state_file }}
          state_push_branch: ${{ inputs.state_push_branch }}
          target_json: ${{ inputs.target_json }}
          usage_json: ${{ needs.agent-l2.outputs.usage_json || '' }}
          verdict: ${{ needs.agent-l2.outputs.verdict }}

      - name: Resolve Run Log Metadata
        id: run_log_meta
        if: always()
        env:
          AGENT_RESULT: ${{ needs.agent-l2.result }}
          EXEC_FAILURE_MESSAGE: ${{ needs.agent-l2.outputs.failure_message }}
          EXEC_FAILURE_STAGE: ${{ needs.agent-l2.outputs.failure_stage }}
          FINALIZE_FAILURE_MESSAGE: ${{ steps.finalize.outputs.failure_message }}
          FINALIZE_FAILURE_STAGE: ${{ steps.finalize.outputs.failure_stage }}
          FINALIZE_STEP_RESULT: ${{ steps.finalize.outcome }}
        run: |
          set -euo pipefail
          stage="${EXEC_FAILURE_STAGE:-}"
          msg="${EXEC_FAILURE_MESSAGE:-}"
          if [[ -z "${stage}" && "${AGENT_RESULT}" != "success" && "${AGENT_RESULT}" != "skipped" ]]; then
            stage="agent_execute"
          fi
          if [[ "${FINALIZE_STEP_RESULT}" == "failure" ]]; then
            if [[ -n "${FINALIZE_FAILURE_STAGE}" || -n "${FINALIZE_FAILURE_MESSAGE}" ]]; then
              stage="${FINALIZE_FAILURE_STAGE:-finalize}"
              msg="${FINALIZE_FAILURE_MESSAGE}"
            elif [[ -z "${stage}" ]]; then
              stage="finalize"
            fi
          fi
          {
            echo "agent_result=${AGENT_RESULT}"
            if [[ -n "${stage}" ]]; then
              echo "failure_stage=${stage}"
              delim="RUN_LOG_FAILURE_MSG_$(openssl rand -hex 8)"
              echo "failure_message<<${delim}"
              printf '%s' "${msg}"
              echo "${delim}"
            fi
          } >> "${GITHUB_OUTPUT}"

      - name: Append Run Log
        if: always()
        uses: y-miyazaki/config/.github/actions/loop-run-log@b95e510f2fc24d65f4e92846123eaf2e7cb49c0b # v1.8.97
        with:
          agent_result: ${{ steps.run_log_meta.outputs.agent_result }}
          attempts: ${{ needs.agent-l2.outputs.attempts || '' }}
          base_branch: ${{ inputs.state_push_branch != '' && inputs.state_push_branch || inputs.base_branch }}
          failure_message: ${{ steps.run_log_meta.outputs.failure_message }}
          failure_stage: ${{ steps.run_log_meta.outputs.failure_stage }}
          github_token: ${{ steps.resolve_github_token.outputs.github_token }}
          has_changes: ${{ needs.agent-l2.outputs.has_changes }}
          loop_name: ${{ inputs.loop_name }}
          outcome: ${{ steps.finalize.outcome == 'failure' && 'error' || steps.finalize.outputs.outcome || (needs.agent-l2.result != 'success' && needs.agent-l2.result != 'skipped' && 'error') || (needs.agent-l2.outputs.verdict == 'REJECT' && 'rejected') || 'no-changes' }}
          run_log_file: ${{ inputs.run_log_file }}
          run_started_at: ${{ inputs.run_started_at }}
          skip_reason: ${{ inputs.skip_reason }}
          usage_json: ${{ needs.agent-l2.outputs.usage_json || '' }}
          verdict: ${{ needs.agent-l2.outputs.verdict }}

      - name: Notify Pull Request
        continue-on-error: true
        if: >-
          always() &&
          steps.notify_target.outputs.pr_number != ''
        uses: y-miyazaki/config/.github/actions/loop-notify-pr@b95e510f2fc24d65f4e92846123eaf2e7cb49c0b # v1.8.97
        with:
          attempts: ${{ needs.agent-l2.outputs.attempts || '' }}
          auto_merge: ${{ inputs.auto_merge }}
          commit_sha: ${{ steps.finalize.outputs.commit_sha || '' }}
          engine: ${{ inputs.engine }}
