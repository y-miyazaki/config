# Reusable workflow: Loop agent execution
# L1: agent-l1 (loop-agent-once) → finalize-l1 (loop-finalize and run-log)
# L2/L3: agent-l2 (loop-execute) → finalize-l2 (loop-finalize and run-log always)
# loop-finalize branches on delivery alone (issue_comment | none | pr_create | pr_push | pr_review); delivery and
# pr_auto_merge are detect outputs passed through unchanged by the callers.
# The handoff key, checkout ref and base branch are read from target_json in each job.
# Caller-facing prompts: loop-detect assembles maker text (prompt_text); domain checker rubric is agent_checker_instructions.
# Checker prompt scaffolding (INITIAL/REGRESSION, output contract) is owned by loop-execute — not workflow_call inputs here.
# Contract (L2/L3): outputs { branch, has_changes, verdict, reason, attempts }
# Token resolution: agent jobs (agent-l1 / agent-l2) get only the read-only github.token; only the finalize jobs
# (finalize-l1 / finalize-l2) resolve a write token from BOT_APP_* + optional GH_TOKEN.
# agent-l2 hands its branch to finalize-l2 as a git bundle artifact; finalize-l2 verifies and pushes it.
# Do not accept a pre-resolved token via workflow_call secrets named GITHUB_TOKEN (reserved).
#   docs/explanation/loop-engineering/loop-caller-reusable-design.md#github-token-resolution
name: ci-loop-agent

on:
  workflow_call:
    inputs:
      agent_branch_prefix:
        default: "loop"
        description: "Worktree branch prefix (L2/L3)"
        required: false
        type: string
      agent_checker_effort:
        default: ""
        description: "Checker reasoning effort (claude: low|medium|high|xhigh|max). Empty = engine default"
        required: false
        type: string
      agent_checker_instructions:
        default: ""
        description: "Domain-specific APPROVE/REJECT criteria (L2/L3)"
        required: false
        type: string
      agent_checker_max_turns:
        default: 100
        description: "Maximum checker agent turns (L2/L3)"
        required: false
        type: number
      agent_checker_model:
        default: ""
        description: "Checker model override (L2/L3)"
        required: false
        type: string
      agent_checker_path_pattern:
        default: ""
        description: "Optional extended-regex that picks file paths out of checker text (L2/L3)"
        required: false
        type: string
      agent_checker_skill_name:
        default: "loop-verifier"
        description: "Checker skill name passed to loop-execute"
        required: false
        type: string
      agent_cli_version:
        default: "latest"
        description: "CLI agent version"
        required: false
        type: string
      agent_commit_message:
        default: "chore: loop-automated update"
        description: "Commit message prefix for loop attempts (L2/L3)"
        required: false
        type: string
      agent_edit_allowlist:
        default: ""
        description: "Comma-separated glob allowlist for the maker and checker (L2/L3; validated by detect)"
        required: false
        type: string
      agent_edit_denylist:
        default: ""
        description: "Comma-separated path denylist for the maker and checker (L2/L3); empty applies the loop-execute platform default"
        required: false
        type: string
      agent_engine:
        description: "AI engine (claude | copilot | codex | cursor)"
        required: true
        type: string
      agent_loop_max_attempts:
        default: 3
        description: "Maximum Agent→Verify loop attempts (L2/L3)"
        required: false
        type: number
      agent_maker_effort:
        default: ""
        description: "Maker reasoning effort (claude: low|medium|high|xhigh|max). Empty = engine default"
        required: false
        type: string
      agent_maker_max_turns:
        default: 100
        description: "Maximum maker agent turns per loop attempt"
        required: false
        type: number
      agent_maker_model:
        default: ""
        description: "Maker model override"
        required: false
        type: string
      agent_maker_skill_name:
        default: ""
        description: "Skill name (used for L2 branch naming)"
        required: false
        type: string
      agent_tool_allowlist:
        default: ""
        description: 'Newline-separated permission rules the skill needs, in the engine''s own syntax (claude: "Bash(gh issue view:*)"). The repository''s .claude/settings.json allow rules are not applied in CI; claude adds only a fixed read-only git baseline and always applies a fixed deny list for GitHub writes, push, network, and env commands'
        required: false
        type: string
      agent_unchanged_verdict:
        default: ""
        description: "Verdict when the maker produces no file changes: APPROVE | REJECT (L2/L3; validated by detect)"
        required: false
        type: string
      delivery:
        description: "Where the agent output is delivered: issue_comment | none | pr_create | pr_push | pr_review (detect output; loop-finalize branches on it)"
        required: true
        type: string
      environment:
        default: default
        description: "GitHub environment for maintenance bot secrets"
        required: false
        type: string
      finalize_commit_paths:
        default: ""
        description: "Comma-separated paths to commit with state after the finalize hook"
        required: false
        type: string
      finalize_label_allowlist:
        default: ""
        description: "Newline-separated labels a delivered message may add or remove (delivery issue_comment | pr_review)"
        required: false
        type: string
      finalize_outcome_override:
        default: ""
        description: "Optional explicit finalize outcome (e.g. watch)"
        required: false
        type: string
      finalize_script:
        default: ""
        description: "Optional bash script run once by loop-finalize regardless of delivery (e.g. domain ledger)"
        required: false
        type: string
      handoff_artifact_name:
        default: ""
        description: "loop-handoff artifact name from loop-detect"
        required: false
        type: string
      level:
        description: "Loop level: L1 (read-only), L2 (edits with branch), or L3 (edits with auto-merge). Required: this is the only gate between the read-only agent-l1 job and the write-capable agent-l2, so a caller must choose rather than inherit one"
        required: true
        type: string
      loop_name:
        description: "Loop identifier for state, budget, and run-log"
        required: true
        type: string
      pr_auto_merge:
        default: "false"
        description: "Enable auto-merge on the created PR (detect output: L3 and delivery pr_create)"
        required: false
        type: string
      pr_body:
        default: ""
        description: "PR body text for finalize job"
        required: false
        type: string
      pr_draft:
        default: false
        description: "Create finalize PR as draft when true"
        required: false
        type: boolean
      pr_labels:
        default: "loop-automation"
        description: "Comma-separated labels for created PR (finalize job)"
        required: false
        type: string
      pr_title:
        default: ""
        description: "PR title for finalize job"
        required: false
        type: string
      prompt_text:
        default: ""
        description: "Maker prompt from loop-detect (matrix.target.prompt) or direct L1 invocation"
        required: false
        type: string
      run_log_file:
        default: .loop/loop-run-log.md
        description: "JSONL run log path for budget aggregation (finalize job)"
        required: false
        type: string
      run_started_at:
        default: ""
        description: "Workflow run start timestamp for run log (finalize job)"
        required: false
        type: string
      skip_reason:
        default: "none"
        description: "Detect skip reason recorded in run log (finalize job)"
        required: false
        type: string
      state_branch:
        description: "Branch for .loop/* state and run-log commits"
        required: true
        type: string
      state_file:
        default: ""
        description: "Loop state file path (L2/L3)"
        required: false
        type: string
      target_json:
        default: ""
        description: "Target descriptor from the loop-detect matrix cell; the handoff key, checkout ref and base are read from it (required at every level; empty fails)"
        required: false
        type: string
      verifier_context:
        default: ""
        description: "Additional checker context such as CI logs or lint output (L2/L3)"
        required: false
        type: string
    outputs:
      attempts:
        description: "Number of Agent→Verify attempts (L2/L3)"
        value: ${{ jobs.agent-l2.outputs.attempts || '0' }}
      branch:
        description: "Branch with changes (L2 only, empty if L1 or no changes)"
        value: ${{ jobs.agent-l2.outputs.branch || '' }}
      finalize_outcome_override:
        description: "Optional finalize outcome from Skill deferral (e.g. watch)"
        value: ${{ jobs.agent-l2.outputs.finalize_outcome_override || '' }}
      has_changes:
        description: "Whether agent produced file changes (L2 only)"
        value: ${{ jobs.agent-l2.outputs.has_changes || 'false' }}
      open_rejections:
        description: "JSON array of unresolved structured rejections (L2/L3)"
        value: ${{ jobs.agent-l2.outputs.open_rejections || '[]' }}
      reason:
        description: "Final checker reason (L2/L3)"
        value: ${{ jobs.agent-l2.outputs.reason || '' }}
      usage_json:
        description: "Measured token usage JSON (L1 from agent-l1, L2/L3 from agent-l2)"
        value: ${{ jobs.agent-l1.outputs.usage_json || jobs.agent-l2.outputs.usage_json || '' }}
      verdict:
        description: "Final checker verdict APPROVE/REJECT (L2/L3)"
        value: ${{ jobs.agent-l2.outputs.verdict || '' }}
    secrets:
      AGENT_TOKEN:
        description: "Authentication token for the selected engine"
        required: true
      BOT_APP_CLIENT_ID:
        description: "GitHub App client ID for ruleset-bypass .loop/* pushes (finalize jobs only)"
        required: false
      BOT_APP_PRIVATE_KEY:
        description: "GitHub App private key for ruleset-bypass .loop/* pushes (finalize jobs only)"
        required: false
      GH_TOKEN:
        description: "Optional explicit GitHub token (App → GH_TOKEN → job GITHUB_TOKEN; finalize jobs only)"
        required: false

permissions:
  contents: read
  copilot-requests: write # zizmor: ignore[excessive-permissions]

defaults:
  run:
    shell: bash

jobs:
  agent-l1:
    if: inputs.level == 'L1'
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      message_json: ${{ steps.agent.outputs.message_json }}
      usage_json: ${{ steps.agent.outputs.usage_json }}
    permissions:
      contents: read
      copilot-requests: write # zizmor: ignore[excessive-permissions]
      issues: read
      pull-requests: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Agent Once
        id: agent
        uses: y-miyazaki/config/.github/actions/loop-agent-once@fc3e75c070897e42a9af1f3bb74229e9ff6439b8 # v1.8.124

        with:
          agent_cli_version: ${{ inputs.agent_cli_version }}
          agent_engine: ${{ inputs.agent_engine }}
          agent_maker_effort: ${{ inputs.agent_maker_effort }}
          agent_maker_max_turns: ${{ format('{0}', inputs.agent_maker_max_turns) }}
          agent_maker_model: ${{ inputs.agent_maker_model }}
          agent_token: ${{ secrets.AGENT_TOKEN }}
          agent_tool_allowlist: ${{ inputs.agent_tool_allowlist }}
          github_token: ${{ github.token }}
          prompt_text: ${{ inputs.prompt_text }}

  finalize-l1:
    if: >-
      always() &&
      inputs.level == 'L1' &&
      needs.agent-l1.result != 'cancelled' &&
      needs.agent-l1.result != 'skipped'
    needs: agent-l1
    environment: ${{ inputs.environment }}
    permissions:
      contents: write
      issues: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve GitHub Token
        id: resolve_github_token
        uses: y-miyazaki/config/.github/actions/loop-resolve-push-token@fc3e75c070897e42a9af1f3bb74229e9ff6439b8 # v1.8.124

        with:
          bot_app_client_id: ${{ secrets.BOT_APP_CLIENT_ID }}
          bot_app_private_key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          github_token: ${{ secrets.GH_TOKEN }}

      # GitHub drops a job output that contains a secret value, and a failed
      # write leaves no message file; either way the agent's text is lost.
      - name: Warn Missing Message
        if: needs.agent-l1.result == 'success' && needs.agent-l1.outputs.message_json == '' && inputs.delivery == 'issue_comment'
        run: |
          echo "::warning title=loop-agent::agent-l1 succeeded but produced no message_json; nothing is delivered"

      # continue-on-error: a delivery failure must not mask the run log below,
      # which records it as error. current_sha and branch are empty at L1, so
      # loop-finalize writes no state and pushes no branch.
      - name: Finalize
        continue-on-error: true
        id: finalize
        uses: y-miyazaki/config/.github/actions/loop-finalize@fc3e75c070897e42a9af1f3bb74229e9ff6439b8 # v1.8.124

        with:
          agent_engine: ${{ inputs.agent_engine }}
          agent_result: ${{ needs.agent-l1.result }}
          branch: ""
          current_sha: ""
          delivery: ${{ inputs.delivery }}
          finalize_label_allowlist: ${{ inputs.finalize_label_allowlist }}
          github_token: ${{ steps.resolve_github_token.outputs.github_token }}
          level: ${{ inputs.level }}
          loop_name: ${{ inputs.loop_name }}
          message_json: ${{ needs.agent-l1.outputs.message_json || '' }}
          state_branch: ${{ inputs.state_branch }}
          target_json: ${{ inputs.target_json }}
          usage_json: ${{ needs.agent-l1.outputs.usage_json || '' }}

      - name: Append Run Log
        if: always()
        uses: y-miyazaki/config/.github/actions/loop-run-log@fc3e75c070897e42a9af1f3bb74229e9ff6439b8 # v1.8.124

        with:
          agent_result: ${{ needs.agent-l1.result }}
          failure_message: ${{ steps.finalize.outputs.failure_message }}
          failure_stage: ${{ steps.finalize.outputs.failure_stage || (steps.finalize.outputs.outcome == '' && 'finalize' || '') }}
          github_token: ${{ steps.resolve_github_token.outputs.github_token }}
          has_changes: "false"
          loop_name: ${{ inputs.loop_name }}
          outcome: ${{ steps.finalize.outputs.outcome || 'error' }}
          run_log_file: ${{ inputs.run_log_file }}
          run_started_at: ${{ inputs.run_started_at }}
          skip_reason: ${{ inputs.skip_reason }}
          state_branch: ${{ inputs.state_branch }}
          usage_json: ${{ needs.agent-l1.outputs.usage_json || '' }}

  agent-l2:
    if: inputs.level == 'L2' || inputs.level == 'L3'
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      attempts: ${{ steps.execute.outputs.attempts }}
      branch: ${{ steps.worktree.outputs.branch }}
      failure_message: ${{ steps.execute.outputs.failure_message }}
      failure_stage: ${{ steps.execute.outputs.failure_stage }}
      finalize_outcome_override: ${{ steps.execute.outputs.finalize_outcome_override }}
      has_changes: ${{ steps.execute.outputs.has_changes }}
      notify_context_json: ${{ steps.execute.outputs.notify_context_json }}
      open_rejections: ${{ steps.execute.outputs.open_rejections }}
      reason: ${{ steps.execute.outputs.reason }}
      usage_json: ${{ steps.execute.outputs.usage_json }}
      verdict: ${{ steps.execute.outputs.verdict }}
    permissions:
      actions: read
      contents: read
      copilot-requests: write # zizmor: ignore[excessive-permissions]
      issues: read
      pull-requests: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download Loop Handoff
        if: inputs.handoff_artifact_name != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.handoff_artifact_name }}
          path: ${{ runner.temp }}/loop-handoff

      # No fallback: an empty or malformed target_json fails here instead of
      # silently running the agent against a guessed branch.
      - name: Parse Target
        id: target
        env:
          TARGET_JSON: ${{ inputs.target_json }}
        run: |
          set -euo pipefail
          if [[ -z "${TARGET_JSON}" ]] || ! jq -e 'type == "object"' >/dev/null 2>&1 <<< "${TARGET_JSON}"; then
            echo "::error title=loop-agent::target_json is empty or not a JSON object" >&2
            exit 1
          fi
          nonempty='select(type == "string" and . != "")'
          key="$(jq -er ".key | ${nonempty}" <<< "${TARGET_JSON}")"
          from_branch="$(jq -er ".from.branch | ${nonempty}" <<< "${TARGET_JSON}")"
          from_ref="$(jq -r '.from.ref // ""' <<< "${TARGET_JSON}")"
          base_branch="$(jq -er "(if .mode == \"pull_request\" then .base.branch else .to.branch end) | ${nonempty}" <<< "${TARGET_JSON}")"
          bundle_artifact_name="loop-agent-bundle-${GITHUB_RUN_ATTEMPT}-$(printf '%s' "${key}" | sha256sum | cut -c1-16)"
          {
            echo "base_branch=${base_branch}"
            echo "bundle_artifact_name=${bundle_artifact_name}"
            echo "from_branch=${from_branch}"
            echo "from_ref=${from_ref}"
            echo "key=${key}"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Worktree
        id: worktree
        uses: y-miyazaki/config/.github/actions/loop-worktree-setup@fc3e75c070897e42a9af1f3bb74229e9ff6439b8 # v1.8.124

        with:
          agent_branch_prefix: ${{ inputs.agent_branch_prefix }}
          agent_maker_skill_name: ${{ inputs.agent_maker_skill_name }}
          from_branch: ${{ steps.target.outputs.from_branch }}
          from_ref: ${{ steps.target.outputs.from_ref }}
          github_token: ${{ github.token }}

      - name: Execute Bounded Loop
        id: execute
        uses: y-miyazaki/config/.github/actions/loop-execute@fc3e75c070897e42a9af1f3bb74229e9ff6439b8 # v1.8.124

        with:
          agent_checker_effort: ${{ inputs.agent_checker_effort }}
          agent_checker_instructions: ${{ inputs.agent_checker_instructions }}
          agent_checker_max_turns: ${{ format('{0}', inputs.agent_checker_max_turns) }}
          agent_checker_model: ${{ inputs.agent_checker_model }}
          agent_checker_path_pattern: ${{ inputs.agent_checker_path_pattern }}
          agent_checker_skill_name: ${{ inputs.agent_checker_skill_name }}
          agent_cli_version: ${{ inputs.agent_cli_version }}
          agent_commit_message: ${{ inputs.agent_commit_message }}
          agent_edit_allowlist: ${{ inputs.agent_edit_allowlist }}
          agent_edit_denylist: ${{ inputs.agent_edit_denylist }}
          agent_engine: ${{ inputs.agent_engine }}
          agent_loop_max_attempts: ${{ format('{0}', inputs.agent_loop_max_attempts) }}
          agent_maker_effort: ${{ inputs.agent_maker_effort }}
          agent_maker_max_turns: ${{ format('{0}', inputs.agent_maker_max_turns) }}
          agent_maker_model: ${{ inputs.agent_maker_model }}
          agent_maker_skill_name: ${{ inputs.agent_maker_skill_name }}
          agent_token: ${{ secrets.AGENT_TOKEN }}
          agent_tool_allowlist: ${{ inputs.agent_tool_allowlist }}
          agent_unchanged_verdict: ${{ inputs.agent_unchanged_verdict }}
          base_branch: ${{ steps.target.outputs.base_branch }}
          branch: ${{ steps.worktree.outputs.branch }}
          github_token: ${{ github.token }}
          handoff_dir: ${{ runner.temp }}/loop-handoff
          handoff_key: ${{ steps.target.outputs.key }}
          prompt_text: ${{ inputs.prompt_text }}
          verifier_context: ${{ inputs.verifier_context }}
          worktree_path: ${{ steps.worktree.outputs.worktree_path }}

      # No overwrite: the name is predictable, so an artifact the agent uploaded
      # first under the same name fails this step instead of being replaced.
      - name: Upload Agent Bundle
        if: steps.execute.outputs.has_changes == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          if-no-files-found: error
          name: ${{ steps.target.outputs.bundle_artifact_name }}
          path: ${{ steps.execute.outputs.bundle_file }}
          retention-days: 1

  finalize-l2:
    if: >-
      always() &&
      (inputs.level == 'L2' || inputs.level == 'L3') &&
      needs.agent-l2.result != 'cancelled' &&
      needs.agent-l2.result != 'skipped'
    needs: agent-l2
    environment: ${{ inputs.environment }}
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download Loop Handoff
        if: inputs.handoff_artifact_name != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.handoff_artifact_name }}
          path: ${{ runner.temp }}/loop-handoff

      # Tolerates an empty target_json so the run log below is still written;
      # loop-finalize itself fails closed on an empty target_json.
      - name: Parse Target
        id: target
        env:
          TARGET_JSON: ${{ inputs.target_json }}
        run: |
          set -euo pipefail
          bundle_artifact_name=""
          from_ref=""
          key=""
          pr_number=""
          if [[ -n "${TARGET_JSON}" ]] && jq -e 'type == "object"' >/dev/null 2>&1 <<< "${TARGET_JSON}"; then
            from_ref="$(jq -r '.from.ref // empty' <<< "${TARGET_JSON}")"
            key="$(jq -r '.key // empty' <<< "${TARGET_JSON}")"
            pr_number="$(jq -r '.to.pr_number // empty' <<< "${TARGET_JSON}")"
          fi
          if [[ -n "${key}" ]]; then
            bundle_artifact_name="loop-agent-bundle-${GITHUB_RUN_ATTEMPT}-$(printf '%s' "${key}" | sha256sum | cut -c1-16)"
          fi
          {
            echo "bundle_artifact_name=${bundle_artifact_name}"
            echo "from_ref=${from_ref}"
            echo "key=${key}"
            echo "pr_number=${pr_number}"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve GitHub Token
        id: resolve_github_token
        uses: y-miyazaki/config/.github/actions/loop-resolve-push-token@fc3e75c070897e42a9af1f3bb74229e9ff6439b8 # v1.8.124

        with:
          bot_app_client_id: ${{ secrets.BOT_APP_CLIENT_ID }}
          bot_app_private_key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          github_token: ${{ secrets.GH_TOKEN }}

      # continue-on-error: a missing bundle (for example a finalize-l2-only
      # re-run) leaves agent_bundle_dir without branch.bundle; loop-finalize
      # then fails closed (stage push) and the run log below still runs.
      - name: Download Agent Bundle
        continue-on-error: true
        if: needs.agent-l2.result == 'success' && needs.agent-l2.outputs.has_changes == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ steps.target.outputs.bundle_artifact_name }}
          path: ${{ runner.temp }}/loop-agent-bundle

      # continue-on-error: a landing, PR, or delivery failure must not stop the
      # run log and the PR notification below. loop-finalize resolves the final
      # outcome (error when any of its steps failed) and the failure stage; the
      # steps below only default an empty outcome to error.
      - name: Finalize
        continue-on-error: true
        id: finalize
        uses: y-miyazaki/config/.github/actions/loop-finalize@fc3e75c070897e42a9af1f3bb74229e9ff6439b8 # v1.8.124

        with:
          agent_branch_prefix: ${{ inputs.agent_branch_prefix }}
          agent_bundle_dir: ${{ runner.temp }}/loop-agent-bundle
          agent_edit_allowlist: ${{ inputs.agent_edit_allowlist }}
          agent_edit_denylist: ${{ inputs.agent_edit_denylist }}
          agent_engine: ${{ inputs.agent_engine }}
          agent_failure_message: ${{ needs.agent-l2.outputs.failure_message }}
          agent_failure_stage: ${{ needs.agent-l2.outputs.failure_stage }}
          agent_maker_skill_name: ${{ inputs.agent_maker_skill_name }}
          agent_result: ${{ needs.agent-l2.result }}
          branch: ${{ needs.agent-l2.outputs.branch }}
          current_sha: ${{ steps.target.outputs.from_ref }}
          delivery: ${{ inputs.delivery }}
          finalize_commit_paths: ${{ inputs.finalize_commit_paths }}
          finalize_label_allowlist: ${{ inputs.finalize_label_allowlist }}
          finalize_outcome_override: ${{ inputs.finalize_outcome_override != '' && inputs.finalize_outcome_override || needs.agent-l2.outputs.finalize_outcome_override }}
          finalize_script: ${{ inputs.finalize_script }}
          github_token: ${{ steps.resolve_github_token.outputs.github_token }}
          handoff_dir: ${{ runner.temp }}/loop-handoff
          handoff_key: ${{ steps.target.outputs.key }}
          has_changes: ${{ needs.agent-l2.outputs.has_changes }}
          level: ${{ inputs.level }}
          loop_name: ${{ inputs.loop_name }}
          notify_context_json: ${{ needs.agent-l2.outputs.notify_context_json || '{}' }}
          open_rejections: ${{ needs.agent-l2.outputs.open_rejections }}
          pr_auto_merge: ${{ inputs.pr_auto_merge }}
          pr_body: ${{ inputs.pr_body }}
          pr_draft: ${{ inputs.pr_draft == true && 'true' || 'false' }}
          pr_labels: ${{ inputs.pr_labels }}
          pr_title: ${{ inputs.pr_title }}
          reject_reason: ${{ needs.agent-l2.outputs.reason }}
          skip_reason: ${{ inputs.skip_reason }}
          state_branch: ${{ inputs.state_branch }}
          state_file: ${{ inputs.state_file }}
          target_json: ${{ inputs.target_json }}
          usage_json: ${{ needs.agent-l2.outputs.usage_json || '' }}
          verdict: ${{ needs.agent-l2.outputs.verdict }}

      - name: Append Run Log
        if: always()
        uses: y-miyazaki/config/.github/actions/loop-run-log@fc3e75c070897e42a9af1f3bb74229e9ff6439b8 # v1.8.124

        with:
          agent_result: ${{ needs.agent-l2.result }}
          attempts: ${{ needs.agent-l2.outputs.attempts || '' }}
          failure_message: ${{ steps.finalize.outputs.failure_message }}
          failure_stage: ${{ steps.finalize.outputs.failure_stage || (steps.finalize.outputs.outcome == '' && 'finalize' || '') }}
          github_token: ${{ steps.resolve_github_token.outputs.github_token }}
          has_changes: ${{ needs.agent-l2.outputs.has_changes }}
          loop_name: ${{ inputs.loop_name }}
          outcome: ${{ steps.finalize.outputs.outcome || 'error' }}
          run_log_file: ${{ inputs.run_log_file }}
          run_started_at: ${{ inputs.run_started_at }}
          skip_reason: ${{ inputs.skip_reason }}
          state_branch: ${{ inputs.state_branch }}
          usage_json: ${{ needs.agent-l2.outputs.usage_json || '' }}
          verdict: ${{ needs.agent-l2.outputs.verdict }}

      - name: Notify Pull Request
        continue-on-error: true
        if: >-
          always() &&
          steps.target.outputs.pr_number != ''
        uses: y-miyazaki/config/.github/actions/loop-notify-pr@fc3e75c070897e42a9af1f3bb74229e9ff6439b8 # v1.8.124

        with:
          agent_engine: ${{ inputs.agent_engine }}
          agent_loop_max_attempts: ${{ format('{0}', inputs.agent_loop_max_attempts) }}
          attempts: ${{ needs.agent-l2.outputs.attempts || '' }}
          commit_sha: ${{ steps.finalize.outputs.commit_sha || '' }}
          fix_pr_number: ${{ steps.finalize.outputs.pr_number || '' }}
          fix_pr_url: ${{ steps.finalize.outputs.pr_url || '' }}
          github_token: ${{ steps.resolve_github_token.outputs.github_token }}
          loop_name: ${{ inputs.loop_name }}
          loop_run_id: ${{ github.run_id }}
          notify_context_json: ${{ needs.agent-l2.outputs.notify_context_json || '{}' }}
          outcome: ${{ steps.finalize.outputs.outcome || 'error' }}
          pr_auto_merge: ${{ inputs.pr_auto_merge }}
          pr_number: ${{ steps.target.outputs.pr_number }}
          reject_reason: ${{ needs.agent-l2.outputs.reason }}
          repository: ${{ github.repository }}
          target_json: ${{ inputs.target_json }}
          usage_json: ${{ needs.agent-l2.outputs.usage_json || '' }}
          verdict: ${{ needs.agent-l2.outputs.verdict }}
