# Loop workflow: PR revise (L2)
# Intake: issue_comment / pull_request_review_comment with mention | repository_dispatch | workflow_dispatch
# → branch / PR-head caller (ci-loop-caller). Default landing push_head.
name: on-loop-github-pr-revise

run-name: "${{ github.workflow }} PR #${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}"

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  repository_dispatch:
    types: [loop-github-pr-revise]
  workflow_dispatch:
    inputs:
      feedback:
        description: Human revision instructions (required for manual dispatch)
        required: true
        type: string
      git_landing_pull_request:
        description: push_head | open_pr
        required: false
        type: string
        default: push_head
      mention:
        description: Mention token required in comment body
        required: false
        type: string
        default: "@loop"
      pr_number:
        description: Pull request number
        required: true
        type: number

permissions:
  actions: write
  contents: write
  copilot-requests: write # zizmor: ignore[excessive-permissions]
  issues: write
  pull-requests: write

# Serialize per PR; never cancel in-flight work. push_head merges onto latest head (see push_target.sh).
concurrency:
  cancel-in-progress: false
  group: loop-github-pr-revise-${{ github.event.pull_request.number || github.event.issue.number || github.event.client_payload.pr_number || inputs.pr_number || github.run_id }}
  queue: max

jobs:
  loop:
    # Intake gate mirrors detect_pr_revise.sh: bot comments are refused and the
    # @loop mention is required on comment webhooks (dispatch paths bypass it,
    # as in the detect script). Keeping both checks here — not only in detect —
    # stops loop-authored comments from queueing runs behind in-flight work.
    # The mention literal matches the PR_MENTION default in detect_domain_env_json.
    if: >-
      (
        github.event_name != 'issue_comment' ||
        github.event.issue.pull_request != null
      ) &&
      (
        github.event.repository.private == true ||
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'repository_dispatch' ||
        (
          github.event_name == 'pull_request_review_comment' &&
          github.event.comment.user.type != 'Bot' &&
          contains(github.event.comment.body, '@loop') &&
          contains(fromJSON('["MEMBER","OWNER","COLLABORATOR"]'), github.event.comment.author_association)
        ) ||
        (
          github.event_name == 'issue_comment' &&
          github.event.comment.user.type != 'Bot' &&
          contains(github.event.comment.body, '@loop') &&
          contains(fromJSON('["MEMBER","OWNER","COLLABORATOR"]'), github.event.comment.author_association)
        )
      )
    uses: ./.github/workflows/ci-loop-caller.yaml
    with:
      ack_trigger_comment: true
      # Revise reads the PR and its review threads; the push is done by the
      # workflow. No gh issue/label/release access.
      agent_allowed_tools: |
        Bash(gh api:*)
        Bash(gh pr view:*)
        Bash(gh pr diff:*)
        Bash(gh pr comment:*)
      agent_checker_effort: medium
      agent_checker_instructions: |
        ## Criteria for APPROVE

        ALL of the following must be true:
        1. Every item in detect result.comments was addressed (or explicitly deferred); cite comment_id(s)
        2. Changes land on the PR head unless stacked open_pr was requested
        3. Bot comments were not acted on
        4. The maker did not ignore the comments array in favor of only result.comment_body when comments length > 1

        ## Criteria for REJECT

        ANY of the following triggers REJECT:
        - Acting without mention / on bot author
        - Addressing only the webhook trigger while leaving other result.comments items unhandled
        - Unrelated drive-by refactors
      agent_checker_max_turns: 100
      agent_checker_model: claude-opus-5
      agent_checker_skill_name: loop-verifier
      agent_loop_max_attempts: 3
      agent_maker_effort: medium
      agent_maker_instructions: |
        Apply the human's feedback to the PR head.
        Your working directory is already a git worktree checked out at the PR head commit
        (loop-worktree-setup fetched the PR branch and checked out its head OID before you started).
        Edit the files in place. Do not run git fetch, git checkout, git switch, or git pull —
        the branch you need is already there, and the workflow owns the commit and push.
        When detect result.comments has multiple entries, address the full array in one session (not only result.comment_body).
        Comment webhooks require the configured @mention; explicit dispatch paths do not.
        Do not invent mention-less triggers on comment webhooks.
      agent_maker_max_turns: 100
      agent_maker_model: claude-sonnet-5
      agent_maker_skill_name: github-pr-revise
      allowlist: ""
      branch_match: main
      branch_state: main
      budget_max_runs_per_day: 10
      budget_max_tokens_per_day: 1000000
      delivery: open_pr
      denylist: ""
      detect_domain_env_json: ${{ format('{{"PR_NUMBER":"{0}","PR_MENTION":"{1}"}}', github.event.pull_request.number || github.event.issue.number || github.event.client_payload.pr_number || inputs.pr_number || '', inputs.mention || '@loop') }}
      detect_script: .agents/skills/github-pr-revise/scripts/detect_pr_revise.sh
      engine: claude
      environment: default
      git_landing_pull_request: ${{ inputs.git_landing_pull_request || 'push_head' }}
      level: L2
      loop_name: github-pr-revise
      may_edit: true
      no_changes_verdict: REJECT
      pr_enabled: true
      pr_exclude: fork,label:no-loop
      scoped_pr_number: ${{ github.event.pull_request.number || github.event.issue.number || github.event.client_payload.pr_number || inputs.pr_number || 0 }}
      write_target: fix
    secrets:
      AGENT_TOKEN: ${{ secrets.AGENT_TOKEN }}
      BOT_APP_CLIENT_ID: ${{ secrets.MAINTENANCE_BOT_APP_CLIENT_ID }}
      BOT_APP_PRIVATE_KEY: ${{ secrets.MAINTENANCE_BOT_APP_PRIVATE_KEY }}
