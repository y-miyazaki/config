# Reusable workflow: static application security testing (SAST)
# Runs CodeQL and Semgrep. Language-specific; keep govulncheck in ci-go.
name: ci-sast

on:
  workflow_call:
    inputs:
      codeql_languages:
        default: '["actions"]'
        description: 'JSON array of CodeQL languages (e.g. ["actions"], ["actions","go"], ["javascript-typescript","actions"])'
        required: false
        type: string
      python_version:
        default: "3.14"
        description: "Python version for Semgrep install"
        required: false
        type: string
      semgrep_config:
        default: auto
        description: "Semgrep config (auto, p/ci, or ruleset path)"
        required: false
        type: string
      semgrep_version:
        default: 1.182.1
        description: "Semgrep Python package version"
        required: false
        type: string
      uv_version:
        default: "0.13.5"
        description: "uv version for Semgrep install; keep aligned with loop composite actions"
        required: false
        type: string

permissions:
  contents: read
  security-events: write

env:
  CODEQL_LANGUAGES: ${{ inputs.codeql_languages }}
  PYTHON_VERSION: ${{ inputs.python_version }}
  SEMGREP_CONFIG: ${{ inputs.semgrep_config }}
  SEMGREP_VERSION: ${{ inputs.semgrep_version }}
  UV_VERSION: ${{ inputs.uv_version }}

jobs:
  codeql:
    if: ${{ inputs.codeql_languages != '[]' && inputs.codeql_languages != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(inputs.codeql_languages) }}
    steps:
      - name: Detect CodeQL Support
        id: detect
        uses: y-miyazaki/config/.github/actions/detect-codeql-support@a00170af8db10cc0e55ab2662a12e1cefec791ca # v1.9.0


      - name: Checkout Code
        if: steps.detect.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        if: steps.detect.outputs.skip != 'true'
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        if: steps.detect.outputs.skip != 'true'
        uses: github/codeql-action/autobuild@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1

      - name: Perform CodeQL Analysis
        if: steps.detect.outputs.skip != 'true'
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: codeql-${{ matrix.language }}

  semgrep:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Detect SARIF Upload Support
        id: detect
        uses: y-miyazaki/config/.github/actions/detect-sarif-upload-support@a00170af8db10cc0e55ab2662a12e1cefec791ca # v1.9.0


      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}
          version: ${{ env.UV_VERSION }}

      - name: Install Semgrep
        run: uv tool install "semgrep==${SEMGREP_VERSION}"

      - name: Prepare security output directory
        run: mkdir -p security

      - name: Exec Semgrep scans
        run: |
          set -euo pipefail
          semgrep scan \
            --config "${SEMGREP_CONFIG}" \
            --json-output=security/semgrep.json \
            --sarif-output=security/semgrep.sarif \
            --text-output=security/semgrep.txt \
            .
          semgrep scan \
            --config "${SEMGREP_CONFIG}" \
            --error \
            --text \
            .

      - name: Print Semgrep findings
        if: always()
        run: |
          set -euo pipefail
          if [ ! -s security/semgrep.json ]; then
            echo "No Semgrep JSON report was generated."
            exit 0
          fi
          count="$(jq '.results | length' security/semgrep.json)"
          echo "Semgrep findings: ${count}"
          if [ "${count}" -eq 0 ]; then
            exit 0
          fi
          jq -r '
            .results[]
            | "[\(.extra.severity // "UNKNOWN")] \(.check_id) \(.path):\(.start.line) - \(.extra.message)"
          ' security/semgrep.json

      - name: Write Semgrep findings summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## Semgrep Findings"
            echo ""
            if [ ! -s security/semgrep.json ]; then
              echo "_No Semgrep JSON report was generated._"
              exit 0
            fi
            count="$(jq '.results | length' security/semgrep.json)"
            echo "**Total:** ${count}"
            echo ""
            if [ "${count}" -eq 0 ]; then
              echo "No findings."
              exit 0
            fi
            echo "| Severity | Rule | Location | Message |"
            echo "| --- | --- | --- | --- |"
            jq -r '
              .results[]
              | "| \(.extra.severity // "UNKNOWN")"
                + " | `\(.check_id)`"
                + " | `\(.path):\(.start.line)`"
                + " | \(.extra.message | gsub("[|]"; "\\|") | gsub("\n"; " "))"
                + " |"
            ' security/semgrep.json
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload Semgrep SARIF to GitHub Security
        if: always() && steps.detect.outputs.supported == 'true' && hashFiles('security/semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: semgrep
          sarif_file: security/semgrep.sarif

      - name: Upload Semgrep Report Artifact
        if: always() && hashFiles('security/semgrep.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: semgrep-report
          path: |
            security/semgrep.json
            security/semgrep.sarif
            security/semgrep.txt
          retention-days: 30

      - name: Summary
        if: always()
        uses: y-miyazaki/config/.github/actions/summary@a00170af8db10cc0e55ab2662a12e1cefec791ca # v1.9.0

        with:
          artifacts: |
            semgrep-report
          outputs: |
            semgrep_json: security/semgrep.json
            semgrep_sarif: security/semgrep.sarif
            semgrep_txt: security/semgrep.txt
          params: |
            semgrep_config: ${{ env.SEMGREP_CONFIG }}
            semgrep_version: ${{ env.SEMGREP_VERSION }}
            task: sast-semgrep
          status: "${{ job.status }}"
          title: "SAST CI: semgrep"
