# Reusable workflow: mise lockfile update
# Updates mise.lock and auto-commits via GitHub App.
# Requires: BOT_APP_PRIVATE_KEY and BOT_APP_CLIENT_ID secrets.
name: ci-mise-update-lock

on:
  workflow_call:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: string
      mise_version:
        default: "2026.10.1"
        description: "mise version to use"
        required: false
        type: string
    secrets:
      BOT_APP_CLIENT_ID:
        description: "GitHub App Client for auto commit"
        required: true
      BOT_APP_PRIVATE_KEY:
        description: "GitHub App private key for auto commit"
        required: true

permissions: {}

jobs:
  update-lock:
    if: ${{ github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: ${{ inputs.environment }}

    permissions:
      contents: read

    concurrency:
      group: mise-update-lock-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Install mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          cache: false
          install: false
          version: ${{ inputs.mise_version }}

      - name: Update mise.lock
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MISE_LOCKED: "0"
        run: mise lock

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.BOT_APP_CLIENT_ID }}
          permission-contents: write
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Configure git auth
        uses: y-miyazaki/config/.github/actions/git-auth@e536f07ae19d90476c0dbc7b96c1c216c7dfef48 # v1.8.116
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          operation: configure

      - name: Commit changes
        shell: bash
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail

          git config user.name "repo-maintenance-bot[app]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [[ -z "$(git status --porcelain mise.lock)" ]]; then
            echo "No mise.lock changes to commit."
            exit 0
          fi

          git add mise.lock
          git commit -m "chore(ci): update mise lockfile"

          for attempt in 1 2 3; do
            if git push origin "HEAD:${BRANCH}"; then
              echo "mise.lock pushed to ${BRANCH} on attempt ${attempt}."
              exit 0
            fi
            echo "Push attempt ${attempt} failed; retrying after rebase onto ${BRANCH}."
            git fetch origin "${BRANCH}"
            git rebase "origin/${BRANCH}"
          done

          echo "::error::Failed to push mise.lock to ${BRANCH} after 3 attempts."
          exit 1

      - name: Clear git auth
        if: always()
        uses: y-miyazaki/config/.github/actions/git-auth@e536f07ae19d90476c0dbc7b96c1c216c7dfef48 # v1.8.116
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          operation: clear

      - name: Summary
        if: always()
        uses: y-miyazaki/config/.github/actions/summary@e536f07ae19d90476c0dbc7b96c1c216c7dfef48 # v1.8.116
        with:
          params: |
            environment: ${{ inputs.environment }}
            mise_version: ${{ inputs.mise_version }}
          status: "${{ job.status }}"
          title: "Mise Update Lock"
