#######################################
# Description:
#   Composite action: detect CodeQL support
#   Detects whether CodeQL should run for the repository.
#
# Usage:
#   uses: y-miyazaki/config/.github/actions/detect-codeql-support@<commit SHA>
#   Called by: ci-sast.yaml
#
# Design Rules:
#   - Leaf composite: MUST NOT call another config composite via uses: (third-party actions are allowed; pin by full SHA)
#
# Dependencies:
#   - Input github_token (read access to the repository API)
#
# References:
#   - docs/explanation/github-workflows-design.md
#   - docs/reference/specification.md
#######################################
name: detect-codeql-support
description: Detect whether workflow CodeQL should run for the repository.

inputs:
  github_token:
    default: ${{ github.token }}
    description: GitHub token for API access
    required: false

outputs:
  skip:
    description: true when workflow CodeQL should be skipped
    value: ${{ steps.detect.outputs.skip }}

runs:
  using: composite
  steps:
    - name: Detect CodeQL Support
      id: detect
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
      run: bash "${GITHUB_ACTION_PATH}/lib/detect.sh"
