name: loop-agent-once
description: "Run a single AI agent session (claude/copilot/codex/cursor). For non-loop one-shot use."

inputs:
  agent_token:
    description: "Authentication token for the selected engine (ANTHROPIC_API_KEY for claude, COPILOT_GITHUB_TOKEN for copilot, CURSOR_API_KEY for cursor, OPENAI_API_KEY for codex)"
    required: true
  cli_version:
    default: "latest"
    description: "CLI package version"
    required: false
  engine:
    description: "AI engine (claude or copilot or codex or cursor)"
    required: true
  github_token:
    description: "Resolved GitHub token for gh CLI and GitHub API side effects"
    required: true
  max_turns:
    default: "5"
    description: "Maximum agent conversation turns"
    required: false
  model:
    default: ""
    description: "Optional model override"
    required: false
  node_version:
    default: "24.19.0"
    description: "Node.js version for MCP servers (npx); keep aligned with mise.toml node"
    required: false
  output_file:
    default: ""
    description: "Optional path to write agent stdout"
    required: false
  prompt_text:
    description: "Prompt text to pass to the agent"
    required: true
  uv_version:
    default: "0.12.2"
    description: "uv version for MCP servers (uvx); keep aligned with mise.toml aqua:astral-sh/uv"
    required: false
  working_directory:
    default: "."
    description: "Working directory for agent execution"
    required: false

outputs:
  usage_json:
    description: "Measured token usage JSON (empty when CLI usage is unavailable)"
    value: ${{ steps.run.outputs.usage_json }}

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node_version }}

    - name: Setup uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        enable-cache: true
        prune-cache: true
        version: ${{ inputs.uv_version }}

    - name: Install CLI
      shell: bash
      env:
        CLI_VERSION: ${{ inputs.cli_version }}
        ENGINE: ${{ inputs.engine }}
      run: bash "${GITHUB_ACTION_PATH}/../loop-install-cli/lib/install.sh"

    - name: Run CLI Agent
      id: run
      shell: bash
      env:
        AGENT_TOKEN: ${{ inputs.agent_token }}
        ENGINE: ${{ inputs.engine }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
        MAX_TURNS: ${{ inputs.max_turns }}
        MODEL: ${{ inputs.model }}
        OUTPUT_FILE: ${{ inputs.output_file }}
        PROMPT: ${{ inputs.prompt_text }}
        WORKING_DIRECTORY: ${{ inputs.working_directory }}
      working-directory: ${{ inputs.working_directory }}
      run: bash "${GITHUB_ACTION_PATH}/lib/run.sh"
