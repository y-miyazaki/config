name: loop-entity-detect
description: >-
  Run one entity detect_script, apply light budget check, build single-target
  matrix and upload loop-handoff artifact for ci-loop-agent.
inputs:
  agent_checker_instructions:
    description: Domain-specific APPROVE/REJECT rubric
    required: true
  agent_checker_max_turns:
    description: Maximum checker agent turns per verification
    required: true
  agent_checker_model:
    description: Checker model ID
    required: true
  agent_loop_max_attempts:
    description: Maximum Agent→Verify retry cycles
    required: true
  agent_maker_instructions:
    default: ""
    description: Extra instructions appended to maker prompt
    required: false
  agent_maker_max_turns:
    description: Maximum maker agent turns per loop attempt
    required: true
  agent_maker_model:
    description: Maker model ID
    required: true
  agent_maker_skill_name:
    description: Skill directory name under common package
    required: true
  allowlist:
    default: ""
    description: Comma-separated globs (may be empty for L1 API-only loops)
    required: false
  budget_file:
    default: .loop/loop-budget.json
    description: Path to loop budget JSON
    required: false
  budget_max_runs_per_day:
    default: ""
    description: Daily run cap keyed by loop_name
    required: false
  budget_max_tokens_per_day:
    default: ""
    description: Daily aggregated token cap
    required: false
  delivery:
    default: none
    description: Platform delivery after APPROVE
    required: false
  detect_script:
    description: Path to domain detect_*.sh script
    required: true
  dispatch_hook_script:
    default: ""
    description: Optional trusted post-detect hook (e.g. repository_dispatch)
    required: false
  dispatch_hook_token:
    default: ""
    description: Token for dispatch hook (falls back to github_token input)
    required: false
  engine:
    description: AI engine
    required: true
  github_token:
    description: Resolved GitHub token for detect scripts and API calls
    required: true
  infer_files_pattern:
    default: ""
    description: Extended regex to infer file paths from checker text
    required: false
  level:
    default: L1
    description: Autonomy level
    required: false
  loop_name:
    description: Loop name for budget/state/run-log
    required: true
  may_edit:
    default: "false"
    description: Whether maker may edit repository files
    required: false
  no_changes_verdict:
    default: APPROVE
    description: Verdict when agent makes no file changes
    required: false
  pr_body:
    default: ""
    description: PR body template (unused when delivery=none)
    required: false
  pr_title:
    default: ""
    description: PR title template (unused when delivery=none)
    required: false
  run_log_file:
    default: .loop/loop-run-log.md
    description: Path to loop run log
    required: false
  state_file:
    default: ""
    description: Optional state file path override
    required: false
  write_target:
    default: report
    description: Agent artifact when may_edit is true
    required: false
outputs:
  agent_checker_instructions:
    description: Checker criteria
    value: ${{ steps.config.outputs.agent_checker_instructions }}
  agent_checker_max_turns:
    description: Checker max turns
    value: ${{ steps.config.outputs.agent_checker_max_turns }}
  agent_checker_model:
    description: Checker model
    value: ${{ steps.config.outputs.agent_checker_model }}
  agent_loop_max_attempts:
    description: Loop max attempts
    value: ${{ steps.config.outputs.agent_loop_max_attempts }}
  agent_maker_max_turns:
    description: Maker max turns
    value: ${{ steps.config.outputs.agent_maker_max_turns }}
  agent_maker_model:
    description: Maker model
    value: ${{ steps.config.outputs.agent_maker_model }}
  agent_maker_skill_name:
    description: Skill name
    value: ${{ steps.config.outputs.agent_maker_skill_name }}
  allowlist:
    description: Allowlist for execute job
    value: ${{ inputs.allowlist }}
  delivery:
    description: Resolved platform delivery channel
    value: ${{ steps.detect.outputs.delivery }}
  engine:
    description: AI engine
    value: ${{ steps.config.outputs.engine }}
  handoff_artifact_name:
    description: Uploaded artifact name for loop-handoff bundle
    value: ${{ steps.handoff.outputs.artifact_name }}
  infer_files_pattern:
    description: Infer files pattern for execute
    value: ${{ inputs.infer_files_pattern }}
  level:
    description: Autonomy level
    value: ${{ steps.config.outputs.level }}
  loop_name:
    description: Loop name for budget lookup and run log pattern
    value: ${{ inputs.loop_name }}
  no_changes_verdict:
    description: Verdict when maker produces no file changes
    value: ${{ inputs.no_changes_verdict }}
  pr_body:
    description: PR body static section for finalize
    value: ${{ inputs.pr_body }}
  pr_title:
    description: PR title for finalize
    value: ${{ inputs.pr_title }}
  should_run:
    description: Whether the execute job should run
    value: ${{ steps.detect.outputs.should_run }}
  skip_reason:
    description: Why execution was skipped (budget | detect_skip)
    value: ${{ steps.detect.outputs.skip_reason }}
  state_file:
    description: Resolved loop state JSON path
    value: ${{ steps.paths.outputs.state_file }}
  target_matrix:
    description: Slim single-element (or empty) target matrix JSON
    value: ${{ steps.detect.outputs.target_matrix }}
runs:
  using: composite
  steps:
    - name: Pack Config
      id: config
      shell: bash
      env:
        AGENT_CHECKER_INSTRUCTIONS: ${{ inputs.agent_checker_instructions }}
        AGENT_CHECKER_MAX_TURNS: ${{ inputs.agent_checker_max_turns }}
        AGENT_CHECKER_MODEL: ${{ inputs.agent_checker_model }}
        AGENT_LOOP_MAX_ATTEMPTS: ${{ inputs.agent_loop_max_attempts }}
        AGENT_MAKER_MAX_TURNS: ${{ inputs.agent_maker_max_turns }}
        AGENT_MAKER_MODEL: ${{ inputs.agent_maker_model }}
        AGENT_MAKER_SKILL_NAME: ${{ inputs.agent_maker_skill_name }}
        ENGINE: ${{ inputs.engine }}
        LEVEL: ${{ inputs.level }}
      run: |
        set -euo pipefail
        AGENT_CHECKER_INSTRUCTIONS_DELIM="CRITERIA_$(openssl rand -hex 8)"
        {
          echo "agent_maker_max_turns=${AGENT_MAKER_MAX_TURNS}"
          echo "agent_maker_model=${AGENT_MAKER_MODEL}"
          echo "agent_loop_max_attempts=${AGENT_LOOP_MAX_ATTEMPTS}"
          echo "agent_checker_instructions<<${AGENT_CHECKER_INSTRUCTIONS_DELIM}"
          echo "${AGENT_CHECKER_INSTRUCTIONS}"
          echo "${AGENT_CHECKER_INSTRUCTIONS_DELIM}"
          echo "agent_checker_max_turns=${AGENT_CHECKER_MAX_TURNS}"
          echo "agent_checker_model=${AGENT_CHECKER_MODEL}"
          echo "engine=${ENGINE}"
          echo "level=${LEVEL}"
          echo "agent_maker_skill_name=${AGENT_MAKER_SKILL_NAME}"
        } >> "${GITHUB_OUTPUT}"

    - name: Resolve State File
      id: paths
      shell: bash
      env:
        LOOP_NAME: ${{ inputs.loop_name }}
        STATE_FILE_INPUT: ${{ inputs.state_file }}
      run: |
        set -euo pipefail
        # shellcheck disable=SC1091
        source "${{ github.action_path }}/../lib/loop/resolve_state_file.sh"
        resolve_state_file

    - name: Detect Entity Target
      id: detect
      shell: bash
      env:
        AGENT_MAKER_INSTRUCTIONS: ${{ inputs.agent_maker_instructions }}
        AGENT_MAKER_SKILL_NAME: ${{ inputs.agent_maker_skill_name }}
        BUDGET_FILE: ${{ inputs.budget_file }}
        BUDGET_MAX_RUNS_PER_DAY: ${{ inputs.budget_max_runs_per_day }}
        BUDGET_MAX_TOKENS_PER_DAY: ${{ inputs.budget_max_tokens_per_day }}
        DELIVERY: ${{ inputs.delivery }}
        DETECT_SCRIPT: ${{ inputs.detect_script }}
        DISPATCH_HOOK_SCRIPT: ${{ inputs.dispatch_hook_script }}
        DISPATCH_HOOK_TOKEN: ${{ inputs.dispatch_hook_token != '' && inputs.dispatch_hook_token || inputs.github_token }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
        LEVEL: ${{ inputs.level }}
        LOOP_NAME: ${{ inputs.loop_name }}
        MAY_EDIT: ${{ inputs.may_edit }}
        RUN_LOG_FILE: ${{ inputs.run_log_file }}
        WRITE_TARGET: ${{ inputs.write_target }}
      run: bash "${GITHUB_ACTION_PATH}/lib/detect.sh"

    - name: Record Handoff Artifact Name
      id: handoff
      if: steps.detect.outputs.should_run == 'true'
      shell: bash
      run: echo "artifact_name=loop-handoff-${GITHUB_RUN_ID}" >> "${GITHUB_OUTPUT}"

    - name: Upload Loop Handoff Artifact
      if: steps.detect.outputs.should_run == 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: loop-handoff-${{ github.run_id }}
        path: ${{ runner.temp }}/loop-handoff
        retention-days: 1
