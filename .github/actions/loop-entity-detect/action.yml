name: loop-entity-detect
description: >-
  Run one entity detect_script, apply light budget check, build single-target
  matrix and upload loop-handoff artifact for ci-loop-agent.
inputs:
  agent_maker_instructions:
    default: ""
    description: Extra instructions appended to maker prompt
    required: false
  agent_maker_skill_name:
    description: Skill directory name under common package
    required: true
  budget_file:
    default: .loop/loop-budget.json
    description: Path to loop budget JSON
    required: false
  budget_max_runs_per_day:
    default: ""
    description: Daily run cap keyed by loop_name
    required: false
  budget_max_tokens_per_day:
    default: ""
    description: Daily aggregated token cap
    required: false
  delivery:
    default: none
    description: Platform delivery after APPROVE
    required: false
  detect_script:
    description: Path to domain detect_*.sh script
    required: true
  dispatch_hook_script:
    default: ""
    description: Optional trusted post-detect hook (e.g. repository_dispatch)
    required: false
  dispatch_hook_token:
    default: ""
    description: Token for dispatch hook (falls back to github_token input)
    required: false
  github_token:
    description: Resolved GitHub token for detect scripts and API calls
    required: true
  level:
    default: L1
    description: Autonomy level
    required: false
  loop_name:
    description: Loop name for budget/state/run-log
    required: true
  may_edit:
    default: "false"
    description: Whether maker may edit repository files
    required: false
  run_log_file:
    default: .loop/loop-run-log.md
    description: Path to loop run log
    required: false
  state_file:
    default: ""
    description: Optional state file path override
    required: false
  write_target:
    default: report
    description: Agent artifact when may_edit is true
    required: false
outputs:
  delivery:
    description: Resolved platform delivery channel
    value: ${{ steps.detect.outputs.delivery }}
  handoff_artifact_name:
    description: Uploaded artifact name for loop-handoff bundle
    value: ${{ steps.handoff.outputs.artifact_name }}
  should_run:
    description: Whether the execute job should run
    value: ${{ steps.detect.outputs.should_run }}
  skip_reason:
    description: Why execution was skipped (budget | detect_skip)
    value: ${{ steps.detect.outputs.skip_reason }}
  state_file:
    description: Resolved loop state JSON path
    value: ${{ steps.paths.outputs.state_file }}
  target_matrix:
    description: Slim single-element (or empty) target matrix JSON
    value: ${{ steps.detect.outputs.target_matrix }}
runs:
  using: composite
  steps:
    - name: Resolve State File
      id: paths
      shell: bash
      env:
        LOOP_NAME: ${{ inputs.loop_name }}
        STATE_FILE_INPUT: ${{ inputs.state_file }}
      run: |
        set -euo pipefail
        # shellcheck disable=SC1091
        source "${{ github.action_path }}/../lib/loop/resolve_state_file.sh"
        resolve_state_file

    - name: Detect Entity Target
      id: detect
      shell: bash
      env:
        AGENT_MAKER_INSTRUCTIONS: ${{ inputs.agent_maker_instructions }}
        AGENT_MAKER_SKILL_NAME: ${{ inputs.agent_maker_skill_name }}
        BUDGET_FILE: ${{ inputs.budget_file }}
        BUDGET_MAX_RUNS_PER_DAY: ${{ inputs.budget_max_runs_per_day }}
        BUDGET_MAX_TOKENS_PER_DAY: ${{ inputs.budget_max_tokens_per_day }}
        DELIVERY: ${{ inputs.delivery }}
        DETECT_SCRIPT: ${{ inputs.detect_script }}
        DISPATCH_HOOK_SCRIPT: ${{ inputs.dispatch_hook_script }}
        DISPATCH_HOOK_TOKEN: ${{ inputs.dispatch_hook_token != '' && inputs.dispatch_hook_token || inputs.github_token }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
        LEVEL: ${{ inputs.level }}
        LOOP_NAME: ${{ inputs.loop_name }}
        MAY_EDIT: ${{ inputs.may_edit }}
        RUN_LOG_FILE: ${{ inputs.run_log_file }}
        WRITE_TARGET: ${{ inputs.write_target }}
      run: bash "${GITHUB_ACTION_PATH}/lib/detect.sh"

    - name: Record Handoff Artifact Name
      id: handoff
      if: steps.detect.outputs.should_run == 'true'
      shell: bash
      run: echo "artifact_name=loop-handoff-${GITHUB_RUN_ID}" >> "${GITHUB_OUTPUT}"

    - name: Upload Loop Handoff Artifact
      if: steps.detect.outputs.should_run == 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: loop-handoff-${{ github.run_id }}
        path: ${{ runner.temp }}/loop-handoff
        retention-days: 1
