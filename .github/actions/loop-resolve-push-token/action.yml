#######################################
# Description:
#   Composite action: resolve the push token
#   Resolves the GitHub API token in order: App bot, github_token input, GITHUB_TOKEN.
#
# Usage:
#   uses: y-miyazaki/config/.github/actions/loop-resolve-push-token@<commit SHA>
#   Called by: ci-loop-caller.yaml, ci-loop-caller-entity.yaml, ci-loop-agent.yaml
#
# Design Rules:
#   - Leaf composite: MUST NOT call another config composite via uses: (third-party actions are allowed; pin by full SHA)
#   - Fail closed when the App is configured but minting the token fails
#
# Dependencies:
#   - Optional bot_app_private_key
#   - actions/create-github-app-token
#
# References:
#   - docs/explanation/loop-engineering/loop-caller-reusable-design.md
#   - docs/explanation/loop-engineering/workflows/loop-caller-inputs-reference.md
#######################################
name: loop-resolve-push-token
description: "Resolve GitHub API token: App bot → github_token input → GITHUB_TOKEN (fail closed if App configured but mint fails)."

inputs:
  bot_app_client_id:
    description: "GitHub App client ID for ruleset-bypass pushes"
    required: false
  bot_app_private_key:
    description: "GitHub App private key for ruleset-bypass pushes"
    required: false
  github_token:
    default: ""
    description: "Optional explicit GitHub token (PAT or override); defaults to GITHUB_TOKEN when empty"
    required: false

outputs:
  github_token:
    description: "Resolved GitHub token (App → github_token → GITHUB_TOKEN)"
    value: ${{ steps.resolve_github_token.outputs.github_token }}

runs:
  using: composite
  steps:
    - name: Generate App Bot Token
      continue-on-error: true
      if: inputs.bot_app_client_id != '' && inputs.bot_app_private_key != ''
      id: app_token
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        client-id: ${{ inputs.bot_app_client_id }}
        permission-contents: write
        permission-issues: write
        permission-pull-requests: write
        permission-workflows: write
        private-key: ${{ inputs.bot_app_private_key }}

    - name: Resolve GitHub Token
      id: resolve_github_token
      shell: bash
      env:
        APP_TOKEN: ${{ steps.app_token.outputs.token }}
        BOT_APP_CONFIGURED: ${{ inputs.bot_app_client_id != '' && inputs.bot_app_private_key != '' && 'true' || 'false' }}
        GITHUB_TOKEN: ${{ github.token }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github_token }}
      run: bash "${GITHUB_ACTION_PATH}/lib/resolve.sh"
