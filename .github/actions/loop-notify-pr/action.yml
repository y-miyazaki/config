name: loop-notify-pr
description: "Post or update a marker PR comment after loop finalize on pull_request targets."

inputs:
  agent_engine:
    default: ""
    description: "AI engine slug for Created By footer (e.g. cursor)"
    required: false
  agent_loop_max_attempts:
    default: ""
    description: "Maximum Agent→Verify attempts"
    required: false
  attempts:
    default: ""
    description: "Number of Agent→Verify attempts"
    required: false
  commit_sha:
    default: ""
    description: "Commit SHA after successful push_head (empty for open_pr)"
    required: false
  fix_pr_number:
    default: ""
    description: "Bot fix PR number from loop-finalize (open_pr)"
    required: false
  fix_pr_url:
    default: ""
    description: "Bot fix PR URL from loop-finalize (open_pr)"
    required: false
  github_event_name:
    default: ""
    description: "Triggering webhook event name (issue_comment | pull_request_review_comment)"
    required: false
  github_token:
    description: "GitHub token with pull-requests: write"
    required: true
  loop_name:
    description: "Loop name for marker scoping"
    required: true
  loop_run_id:
    default: ${{ github.run_id }}
    description: "GitHub Actions workflow run ID"
    required: false
  notify_context_json:
    default: "{}"
    description: "Machine context from loop-execute"
    required: false
  outcome:
    description: "Finalize outcome enum"
    required: true
  pr_auto_merge:
    default: "false"
    description: "Whether L3 auto-merge was enabled on the bot fix PR"
    required: false
  pr_number:
    description: "Target pull request number"
    required: true
  reject_reason:
    default: ""
    description: "Checker rejection reason"
    required: false
  repository:
    default: ${{ github.repository }}
    description: "Repository owner/name"
    required: false
  target_json:
    default: "{}"
    description: "Target descriptor JSON from loop-detect"
    required: false
  trigger_comment_id:
    default: ""
    description: "Triggering comment id for done-thread reply (pr-revise)"
    required: false
  usage_json:
    default: ""
    description: "Measured usage JSON for Created By footer"
    required: false
  verdict:
    default: ""
    description: "Checker verdict (APPROVE or REJECT)"
    required: false

outputs:
  comment_id:
    description: "GraphQL node id of the posted or updated comment"
    value: ${{ steps.notify.outputs.comment_id }}
  comment_url:
    description: "URL of the posted or updated comment"
    value: ${{ steps.notify.outputs.comment_url }}

runs:
  using: composite
  steps:
    - name: Notify Pull Request
      id: notify
      shell: bash
      env:
        AGENT_ENGINE: ${{ inputs.agent_engine }}
        AGENT_LOOP_MAX_ATTEMPTS: ${{ inputs.agent_loop_max_attempts }}
        ATTEMPTS: ${{ inputs.attempts }}
        COMMIT_SHA: ${{ inputs.commit_sha }}
        FIX_PR_NUMBER: ${{ inputs.fix_pr_number }}
        FIX_PR_URL: ${{ inputs.fix_pr_url }}
        GITHUB_EVENT_NAME: ${{ inputs.github_event_name || github.event_name }}
        GITHUB_SERVER_URL: ${{ github.server_url }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
        LOOP_NAME: ${{ inputs.loop_name }}
        LOOP_RUN_ID: ${{ inputs.loop_run_id }}
        NOTIFY_CONTEXT_JSON: ${{ inputs.notify_context_json }}
        OUTCOME: ${{ inputs.outcome }}
        PR_AUTO_MERGE: ${{ inputs.pr_auto_merge }}
        PR_NUMBER: ${{ inputs.pr_number }}
        REJECT_REASON: ${{ inputs.reject_reason }}
        REPOSITORY: ${{ inputs.repository }}
        TARGET_JSON: ${{ inputs.target_json }}
        TRIGGER_COMMENT_ID: ${{ inputs.trigger_comment_id || github.event.comment.id || '' }}
        USAGE_JSON: ${{ inputs.usage_json }}
        VERDICT: ${{ inputs.verdict }}
      run: bash "${GITHUB_ACTION_PATH}/lib/notify.sh"
