name: loop-worktree-setup
description: "Create an isolated git worktree at from_ref on from_branch for loop agent modifications."

inputs:
  agent_branch_prefix:
    default: "loop"
    description: "Agent branch name prefix (result: <prefix>/<skill>/<date>)"
    required: false
  agent_maker_skill_name:
    description: "Skill name used in branch naming"
    required: true
  branch:
    default: ""
    description: "Existing agent branch to check out (empty = create new branch)"
    required: false
  from_branch:
    default: ""
    description: "Branch to fetch and create the worktree from (target_json.from.branch). Empty = current branch."
    required: false
  from_ref:
    default: ""
    description: "Ref to check out in the worktree (target_json.from.ref). Empty = origin/from_branch."
    required: false
  github_token:
    description: "Read-only GitHub token for fetch"
    required: true
outputs:
  branch:
    description: "Created branch name"
    value: ${{ steps.setup.outputs.branch }}
  worktree_path:
    description: "Absolute path to the worktree"
    value: ${{ steps.setup.outputs.worktree_path }}

runs:
  using: composite
  steps:
    - name: Setup Worktree
      id: setup
      shell: bash
      env:
        AGENT_BRANCH_PREFIX: ${{ inputs.agent_branch_prefix }}
        AGENT_MAKER_SKILL_NAME: ${{ inputs.agent_maker_skill_name }}
        BRANCH: ${{ inputs.branch }}
        FROM_BRANCH: ${{ inputs.from_branch }}
        FROM_REF: ${{ inputs.from_ref }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
      run: |
        set -euo pipefail

        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git config http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 -w0)"

        WORKTREE_PATH="${RUNNER_TEMP}/worktree-${AGENT_MAKER_SKILL_NAME}"
        CHECKOUT_REF=""

        if [[ -n "${FROM_BRANCH}" ]]; then
          if ! [[ "${FROM_BRANCH}" =~ ^[a-zA-Z0-9/_.-]+$ ]]; then
            echo "::error::Invalid from branch: ${FROM_BRANCH}"
            exit 1
          fi
          git fetch origin "${FROM_BRANCH}" --prune
        fi

        if [[ -n "${FROM_REF}" ]]; then
          if ! [[ "${FROM_REF}" =~ ^[a-zA-Z0-9/_.-]+$ ]]; then
            echo "::error::Invalid from ref: ${FROM_REF}"
            exit 1
          fi
          CHECKOUT_REF="${FROM_REF}"
        elif [[ -n "${FROM_BRANCH}" ]]; then
          CHECKOUT_REF="origin/${FROM_BRANCH}"
        fi

        if [[ -n "${BRANCH}" ]]; then
          if ! [[ "${BRANCH}" =~ ^[a-zA-Z0-9/_.-]+$ ]]; then
            echo "::error::Invalid branch name: ${BRANCH}"
            exit 1
          fi
          git fetch origin "${BRANCH}"
          rm -rf "${WORKTREE_PATH}"
          git worktree add "${WORKTREE_PATH}" "origin/${BRANCH}"
        else
          DATE=$(date -u +%Y%m%d-%H%M%S)
          BRANCH="${AGENT_BRANCH_PREFIX}/${AGENT_MAKER_SKILL_NAME}/${DATE}"

          if ! [[ "${BRANCH}" =~ ^[a-zA-Z0-9/_.-]+$ ]]; then
            echo "::error::Invalid branch name: ${BRANCH}"
            exit 1
          fi

          rm -rf "${WORKTREE_PATH}"
          if [[ -n "${CHECKOUT_REF}" ]]; then
            git worktree add -b "${BRANCH}" "${WORKTREE_PATH}" "${CHECKOUT_REF}"
          else
            git worktree add -b "${BRANCH}" "${WORKTREE_PATH}" HEAD
          fi
        fi

        {
          echo "branch=${BRANCH}"
          echo "worktree_path=${WORKTREE_PATH}"
        } >> "$GITHUB_OUTPUT"
