#######################################
# Description:
#   Composite action: detect SARIF upload support
#   Detects whether SARIF upload to GitHub Security is supported for the repository.
#
# Usage:
#   uses: y-miyazaki/config/.github/actions/detect-sarif-upload-support@<commit SHA>
#   Called by: ci-sast.yaml, ci-security.yaml, cd-aws-go-registry.yaml
#
# Design Rules:
#   - Leaf composite: MUST NOT call another config composite via uses: (third-party actions are allowed; pin by full SHA)
#
# Dependencies:
#   - Input github_token (read access to the repository API)
#
# References:
#   - docs/explanation/github-workflows-design.md
#   - docs/reference/specification.md
#######################################
name: detect-sarif-upload-support
description: Detect whether SARIF upload to GitHub Security is supported for the repository.

inputs:
  github_token:
    default: ${{ github.token }}
    description: GitHub token for API access
    required: false

outputs:
  supported:
    description: true when SARIF upload is supported
    value: ${{ steps.detect.outputs.supported }}

runs:
  using: composite
  steps:
    - name: Detect SARIF Upload Support
      id: detect
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
      run: bash "${GITHUB_ACTION_PATH}/lib/detect.sh"
