#######################################
# Description:
#   Composite action: SchemaSpy SSM cleanup
#   Terminates the background SSM port-forwarding session when bastion mode is enabled.
#
# Usage:
#   uses: y-miyazaki/config/.github/actions/schemaspy-ssm-cleanup@<commit SHA>
#   Called by: cd-aws-schemaspy.yaml
#
# Design Rules:
#   - Leaf composite: MUST NOT call another config composite via uses: (third-party actions are allowed; pin by full SHA)
#
# Dependencies:
#   - AWS CLI with credentials from the calling job
#
# References:
#   - docs/explanation/github-workflows-design.md
#######################################
name: schemaspy-ssm-cleanup
description: "Terminate background SSM port forwarding session when bastion mode is enabled."

inputs:
  ssm_pid:
    default: ""
    description: "Background SSM session PID from schemaspy-ssm-port-forward"
    required: false

runs:
  using: composite
  steps:
    - name: Cleanup SSM Port Forwarding
      shell: bash
      env:
        SSM_PID: ${{ inputs.ssm_pid }}
      run: bash "${GITHUB_ACTION_PATH}/lib/cleanup.sh"
