#######################################
# Description:
#   Composite action: promote or clear pending loop state
#   Promotes or clears the pending loop state when a fix PR closes.
#
# Usage:
#   uses: y-miyazaki/config/.github/actions/loop-state-promote@<commit SHA>
#   Called by: on-loop-state-promote.yaml
#
# Design Rules:
#   - Leaf composite: MUST NOT call another config composite via uses: (third-party actions are allowed; pin by full SHA)
#
# Dependencies:
#   - Required inputs pr_number, merged, state_branch, github_token
#
# References:
#   - docs/explanation/loop-engineering/loop-engineering-design.md
#   - docs/explanation/loop-engineering/multi-branch-loops-design.md
#   - docs/explanation/loop-engineering/loop-caller-reusable-design.md
#######################################
name: loop-state-promote
description: "Promote or clear pending loop state after a fix PR closes."

inputs:
  github_token:
    description: "GitHub token with contents write (and pull-requests write when state PR fallback may run)"
    required: true
  merged:
    default: "false"
    description: "Whether the pull request was merged"
    required: true
  pr_number:
    description: "Closed pull request number"
    required: true
  state_branch:
    description: "Branch hosting .loop/* state files"
    required: true
  state_pr_skip:
    default: "false"
    description: "When true, skip state PR fallback when direct push to state_branch is blocked"
    required: false

runs:
  using: composite
  steps:
    - name: Promote Pending State
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        MERGED: ${{ inputs.merged }}
        PR_NUMBER: ${{ inputs.pr_number }}
        STATE_BRANCH: ${{ inputs.state_branch }}
        STATE_PR_SKIP: ${{ inputs.state_pr_skip }}
      run: bash "${GITHUB_ACTION_PATH}/lib/run.sh"
