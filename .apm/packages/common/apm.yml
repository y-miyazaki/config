name: config-common
version: 1.0.0
description: Forge-neutral AI assistant instructions and skills (review, markdown, docs-creator) and shared MCP
author: y-miyazaki
license: Apache-2.0
target: all
includes: auto

dependencies:
  apm: []
  mcp:
    - name: context7
      registry: false
      transport: stdio
      command: npx
      args: ["-y", "@upstash/context7-mcp@4.0.3"]
    - name: fetch
      registry: false
      transport: stdio
      command: uvx
      args: ["--with", "mcp>=1.28,<2", "mcp-server-fetch==2026.8.18"]
    - name: codebase-memory-mcp
      registry: false
      transport: stdio
      command: codebase-memory-mcp
      args: []
    - name: lean-ctx
      registry: false
      transport: stdio
      command: npx
      args: ["-y", "lean-ctx-bin@3.9.19"]
