name: config-common
version: 1.0.0
description: Forge-neutral AI assistant instructions and skills (review, markdown, docs-creator) and shared MCP
author: y-miyazaki
license: Apache-2.0
target: all
includes: auto

dependencies:
  apm: []
  mcp:
    - name: context7
      registry: false
      transport: stdio
      command: npx
      args: ["-y", "@upstash/context7-mcp@4.7.0"]
    - name: fetch
      registry: false
      transport: stdio
      command: uvx
      args: ["mcp-server-fetch==2026.11.11"]
    # Wrapped with mcp-compressor (16 tools); delete_project is excluded at the proxy because a
    # per-tool permission deny cannot match tools called through the proxy's invoke_tool.
    # Pinned to 0.34.0: 0.35.0+ cannot connect to the GitHub remote MCP endpoint (see the github package).
    - name: codebase-memory-mcp
      registry: false
      transport: stdio
      command: uvx
      args:
        [
          "mcp-compressor==0.34.0",
          "--exclude-tools=delete_project",
          "--",
          "codebase-memory-mcp",
        ]
