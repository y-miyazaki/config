name: config-github
version: 1.0.0
description: GitHub forge skills (Issues, PRs) and GitHub MCP. Interactive and loop callers. Not GitHub Actions YAML.
author: y-miyazaki
license: Apache-2.0
target: all
includes: auto

dependencies:
  apm: []
  mcp:
    # mcp-compressor is pinned to 0.34.0: 0.35.0 and later fail to initialize the remote
    # streamable HTTP backend ("Transport channel closed"). Renovate updates are disabled
    # for it in renovate/apm-mcp-version.json; unpin once an upstream fix is verified.
    - name: github
      registry: false
      transport: stdio
      command: bash
      args:
        [
          "-lc",
          'TOKEN="${GH_TOKEN:-$GITHUB_TOKEN}"; exec uvx mcp-compressor==0.34.0 -- https://api.githubcopilot.com/mcp/ -H "Authorization=Bearer ${TOKEN}" -H "X-MCP-Readonly=true" --auth explicit-headers',
        ]
