name: config-github
version: 1.0.0
description: GitHub forge skills (Issues, PRs) and GitHub MCP. Interactive and loop callers. Not GitHub Actions YAML.
author: y-miyazaki
license: Apache-2.0
target: all
includes: auto

dependencies:
  apm: []
  mcp:
    - name: github
      registry: false
      transport: stdio
      command: bash
      args:
        [
          "-lc",
          'TOKEN="${GH_TOKEN:-$GITHUB_TOKEN}"; exec uvx mcp-compressor==0.31.8 -- https://api.githubcopilot.com/mcp/ -H "Authorization=Bearer ${TOKEN}" --auth explicit-headers',
        ]
