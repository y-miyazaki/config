id: tech-debt-interactive-bare-fix-001
name: tech-debt bare fix enters apply
description: >-
  Validate that a bare edit verb ("fix") in the user request sets agent_edit_allowed true
  and the run emits apply shape, not survey.
tags:
  - quality
  - interactive
  - agent-edit-allowed
inputs:
  prompt: >-
    Use tech-debt. The user says only "fix". A bare edit verb counts as an edit request, so
    agent_edit_allowed is true and agent_edit_target is report. Classify the documentation signal with a Category label; emit apply shape with ### Changes listing agent_report_file and ## Verification. Do not emit ### Candidates.
    Do not edit files in this mock eval. Emit ## Overview and ## Summary per common-output-format.md.
  context:
    commit_range: eval0001..eval0002
    agent_report_file: docs/report/tech-debt/2026-07-19.md
    skip: false
    signals:
      - kind: broken_doc_ref
        path: README.md
        line: 12
        snippet: "see docs/old-guide.md"
        hint: documentation
    hotspots: []
expected:
  output_contains:
    - Overview
    - Summary
    - Changes
    - Verification
    - agent_edit_allowed is true
  outcomes:
    - type: task_completed
