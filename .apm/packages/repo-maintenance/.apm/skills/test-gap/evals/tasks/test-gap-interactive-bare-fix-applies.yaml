id: test-gap-interactive-bare-fix-001
name: test-gap bare fix enters apply
description: >-
  Validate that a bare edit verb ("fix") in the user request sets agent_edit_allowed true
  and the run emits apply shape, not survey.
tags:
  - quality
  - interactive
  - agent-edit-allowed
inputs:
  prompt: >-
    Use test-gap. The user says only "fix". A bare edit verb counts as an edit request, so
    agent_edit_allowed is true and agent_edit_target is fix. Add tests for one target and emit apply shape with ### Changes and ## Verification; do not claim tests passed unless they were run. Do not emit ### Candidates.
    Do not edit files in this mock eval. Emit ## Overview and ## Summary per common-output-format.md.
  context:
    skip: false
    hotspots:
      - path: scripts/foo.sh
        kind: churn
        count: 7
        window: 90.days
    ledger:
      file: state-test-gap-ledger.json
      processed: []
expected:
  output_contains:
    - Overview
    - Summary
    - Changes
    - Verification
    - agent_edit_allowed is true
  outcomes:
    - type: task_completed
