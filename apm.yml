    # - github.com/y-miyazaki/config/.apm/packages/aws#v1.8.70
    # - github.com/y-miyazaki/config/.apm/packages/go#v1.8.70
    # - github.com/y-miyazaki/config/.apm/packages/go-hooks-claude#v1.8.70
    # - github.com/y-miyazaki/config/.apm/packages/go-hooks-claude#v1.8.70
    # - github.com/y-miyazaki/config/.apm/packages/go-hooks-copilot#v1.8.70
