id: refactor-interactive-bare-fix-001
name: refactor bare fix enters apply
description: >-
  Validate that a bare edit verb ("fix") in the user request sets agent_edit_allowed true
  and the run emits apply shape, not survey.
tags:
  - quality
  - interactive
  - agent-edit-allowed
inputs:
  prompt: >-
    Use refactor. The user says only "fix". A bare edit verb counts as an edit request, so
    agent_edit_allowed is true and agent_edit_target is fix. Emit apply shape with ### Changes and ## Verification. Do not emit ### Candidates.
    Do not edit files in this mock eval. Emit ## Overview and ## Summary per common-output-format.md.
  context:
    commit_range: eval0001..eval0002
    skip: false
    hints:
      - kind: duplication_block
        path: scripts/example.sh
        detail: lines 10-17 duplicate scripts/other.sh:40-47
        lines: 8
expected:
  output_contains:
    - Overview
    - Summary
    - Changes
    - Verification
    - agent_edit_allowed is true
  outcomes:
    - type: task_completed
