name: loop-verifier-eval
description: >-
  Evaluation suite for loop-verifier.
  Verifies APPROVE/REJECT JSON contract, REJECT-default stance, scope boundaries,
  and trigger-negative guardrails (checker does not implement fixes).
skill: loop-verifier
version: "1.0"
config:
  trials_per_task: 5
  timeout_seconds: 180
  parallel: false
  executor: mock
  model: claude-sonnet-4-20250514
metrics:
  - name: task_completion
    weight: 1.0
    threshold: 0.8
    description: Verify evaluation task completes successfully.
graders:
  - type: code
    name: has_structured_output
    weight: 1.0
    config:
      assertions:
        - "'verdict' in output.lower() or 'REJECT' in output or 'APPROVE' in output"
        - "'## Overview' in output or 'Overview' in output"
        - "'Evidence' in output or 'reason' in output.lower()"
  - type: text
    name: report_sections
    weight: 0.5
    config:
      regex_match:
        - (## Overview|## Evidence|verdict)
  - type: behavior
    name: bounded_runtime
    weight: 0.5
    config:
      max_tool_calls: 20
      max_tokens: 80000
      max_duration_ms: 180000
tasks:
  - evals/tasks/*.yaml
