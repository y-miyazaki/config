# Reusable workflow: Loop caller orchestration (branch/PR)
# Shared detect → execute (matrix) → record-skip job graph for on-loop-*.yaml callers.
# Design doc: docs/explanation/loop-engineering/loop-caller-reusable-design.md
# Inputs reference: docs/explanation/loop-engineering/workflows/loop-caller-inputs-reference.md
# Token resolution: per-job loop-resolve-push-token (App → GH_TOKEN → job GITHUB_TOKEN).
# Do not fan out resolved tokens via job outputs — see:
#   docs/explanation/loop-engineering/loop-caller-reusable-design.md#github-token-resolution
name: ci-loop-caller

on:
  workflow_call:
    inputs:
      agent_branch_prefix:
        default: "loop"
        description: "Worktree branch prefix (L2/L3)"
        required: false
        type: string
      agent_checker_effort:
        default: ""
        description: "Checker reasoning effort (claude: low|medium|high|xhigh|max). Empty = engine default"
        required: false
        type: string
      agent_checker_instructions:
        description: "Domain-specific APPROVE/REJECT rubric"
        required: true
        type: string
      agent_checker_max_turns:
        description: "Maximum checker agent turns per verification"
        required: true
        type: number
      agent_checker_model:
        description: "Checker model ID"
        required: true
        type: string
      agent_checker_path_pattern:
        default: ""
        description: "Extended regex that picks file paths out of checker text"
        required: false
        type: string
      agent_checker_skill_name:
        default: loop-verifier
        description: "Checker skill slash-loaded by loop-execute (distinct from agent_maker_skill_name)"
        required: false
        type: string
      agent_cli_version:
        default: "latest"
        description: "CLI agent version"
        required: false
        type: string
      agent_commit_message:
        default: "chore: loop-automated update"
        description: "Commit message prefix for loop attempts (L2/L3)"
        required: false
        type: string
      agent_edit_allowlist:
        default: ""
        description: "Comma-separated globs the maker may edit (required at L2/L3; ** = unrestricted; must be empty at L1)"
        required: false
        type: string
      agent_edit_denylist:
        default: ""
        description: "Comma-separated globs the maker must not edit (optional at L2/L3; empty = platform default; must be empty at L1)"
        required: false
        type: string
      agent_edit_target:
        default: ""
        description: "Maker artifact: fix | report (required at L2/L3; must be empty at L1)"
        required: false
        type: string
      agent_engine:
        description: "AI engine: claude | copilot | codex | cursor"
        required: true
        type: string
      agent_loop_max_attempts:
        description: "Maximum Agent→Verify retry cycles"
        required: true
        type: number
      agent_maker_effort:
        default: ""
        description: "Maker reasoning effort (claude: low|medium|high|xhigh|max). Empty = engine default"
        required: false
        type: string
      agent_maker_instructions:
        default: ""
        description: "Domain-specific maker instructions"
        required: false
        type: string
      agent_maker_max_turns:
        description: "Maximum maker agent turns per loop attempt"
        required: true
        type: number
      agent_maker_model:
        description: "Maker model ID"
        required: true
        type: string
      agent_maker_skill_name:
        description: "Skill package name"
        required: true
        type: string
      agent_tool_allowlist:
        default: ""
        description: 'Newline-separated permission rules the skill needs, in the engine''s own syntax (claude: "Bash(gh issue edit:*)"). Caller-declared only — never derived from detect output. Empty grants nothing beyond the repository''s .claude/settings.json'
        required: false
        type: string
      agent_unchanged_verdict:
        default: ""
        description: "Checker verdict when the maker produces no diff: APPROVE | REJECT (required at L2/L3; must be empty at L1)"
        required: false
        type: string
      budget_file:
        default: .loop/loop-budget.json
        description: "Path to loop budget JSON"
        required: false
        type: string
      budget_max_runs_per_day:
        description: "Daily run cap keyed by loop_name"
        required: false
        type: number
      budget_max_tokens_per_day:
        description: "Daily aggregated token cap"
        required: false
        type: number
      delivery:
        description: "Where the agent output is delivered: none | pr_create | pr_push (required; no default)"
        required: true
        type: string
      detect_branch_match:
        default: ""
        description: "Comma-separated integration branch patterns to watch (empty = no integration targets; not allowed with delivery pr_push)"
        required: false
        type: string
      detect_branch_match_mode:
        default: glob
        description: "How to interpret detect_branch_match: list, glob, or regex"
        required: false
        type: string
      detect_env_json:
        default: "{}"
        description: "JSON object of domain detect script environment variables"
        required: false
        type: string
      detect_max_targets:
        default: 3
        description: "Max targets per cron tick after filters"
        required: false
        type: number
      detect_pr_bot_allowlist:
        default: ""
        description: "Comma-separated bot logins to include when scanning PRs"
        required: false
        type: string
      detect_pr_denylist:
        default: fork,draft,label:no-loop
        description: "PR exclusion tokens"
        required: false
        type: string
      detect_pr_enabled:
        default: false
        description: "Watch open PR heads for detect (required true for delivery pr_push)"
        required: false
        type: boolean
      detect_pr_number:
        description: "When set, detect watches only this open PR number (skip integration fan-out); 0 = unset (delivery pr_push then skips with pr_number_missing)"
        required: false
        type: number
      detect_priority:
        default: integration,pull_request
        description: "Target mode priority order (comma-separated)"
        required: false
        type: string
      detect_script:
        description: "Path to domain detect_*.sh script"
        required: true
        type: string
      environment:
        default: default
        description: "GitHub environment for maintenance bot secrets"
        required: false
        type: string
      finalize_commit_paths:
        default: ""
        description: "Extra paths included in finalize commit (e.g. ledger file)"
        required: false
        type: string
      finalize_hook_script:
        default: ""
        description: "Bash script run once by loop-finalize regardless of delivery (e.g. domain ledger)"
        required: false
        type: string
      finalize_outcome_override:
        default: ""
        description: "Optional explicit finalize outcome (e.g. watch)"
        required: false
        type: string
      level:
        description: "Autonomy: L1 | L2 | L3 (required; no default)"
        required: true
        type: string
      loop_name:
        description: "Loop identifier for state, budget, and concurrency"
        required: true
        type: string
      pr_body:
        default: ""
        description: "Static markdown prefix for finalize PR body"
        required: false
        type: string
      pr_draft:
        default: false
        description: "Create the finalize PR as draft when true (delivery pr_create)"
        required: false
        type: boolean
      pr_labels:
        default: "loop-automation"
        description: "Comma-separated labels for created PR (finalize job)"
        required: false
        type: string
      pr_title:
        default: ""
        description: "PR title when delivery is pr_create"
        required: false
        type: string
      run_log_file:
        default: .loop/loop-run-log.md
        description: "JSONL run log path for budget aggregation"
        required: false
        type: string
      state_branch:
        description: "Branch that stores .loop/* state (not watched unless matched by detect_branch_match)"
        required: true
        type: string
      state_file:
        default: ""
        description: "Override state JSON path (default .loop/state-<loop_name>.json)"
        required: false
        type: string
      trigger_comment_ack:
        default: false
        description: "After detect proceeds, ACK the triggering comment with an eyes reaction (pr-revise)"
        required: false
        type: boolean
    secrets:
      AGENT_TOKEN:
        description: "Authentication token for the selected engine"
        required: true
      BOT_APP_CLIENT_ID:
        description: "GitHub App client ID for ruleset-bypass .loop/* pushes"
        required: false
      BOT_APP_PRIVATE_KEY:
        description: "GitHub App private key for ruleset-bypass .loop/* pushes"
        required: false
      GH_TOKEN:
        description: "Optional explicit GitHub token for resolution (defaults to job GITHUB_TOKEN when empty)"
        required: false

defaults:
  run:
    shell: bash

jobs:
  detect:
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: write
      contents: read
      pull-requests: read
    outputs:
      delivery: ${{ steps.detect.outputs.delivery }}
      handoff_artifact_name: ${{ steps.detect.outputs.handoff_artifact_name }}
      pr_auto_merge: ${{ steps.detect.outputs.pr_auto_merge }}
      run_started_at: ${{ steps.timing.outputs.started_at }}
      should_run: ${{ steps.detect.outputs.should_run }}
      skip_reason: ${{ steps.detect.outputs.skip_reason }}
      state_file: ${{ steps.detect.outputs.state_file }}
      target_matrix: ${{ steps.detect.outputs.target_matrix }}
    steps:
      - name: Record Run Start
        id: timing
        run: echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Export Detect Domain Env
        env:
          DETECT_ENV_JSON: ${{ inputs.detect_env_json }}
        run: |
          set -euo pipefail
          if [[ -n "${DETECT_ENV_JSON}" && "${DETECT_ENV_JSON}" != "{}" ]]; then
            if ! echo "${DETECT_ENV_JSON}" | jq -e 'type == "object"' >/dev/null; then
              echo "detect_env_json must be a JSON object" >&2
              exit 1
            fi
            if ! echo "${DETECT_ENV_JSON}" | jq -e               'to_entries | map(.key) | all(test("^[A-Z_][A-Z0-9_]*$"))'               >/dev/null; then
              bad_key="$(echo "${DETECT_ENV_JSON}" | jq -r                 'to_entries[] | select(.key | test("^[A-Z_][A-Z0-9_]*$") | not) | .key'                 | head -1)"
              echo "detect_env_json keys must match ^[A-Z_][A-Z0-9_]*$ (invalid: ${bad_key})" >&2
              exit 1
            fi
            if ! echo "${DETECT_ENV_JSON}" | jq -e \
              '[to_entries[] | select(.value != "" and ((.value | tostring) | test("[\r\n]")))] | length == 0' \
              >/dev/null; then
              bad_key="$(echo "${DETECT_ENV_JSON}" | jq -r \
                'to_entries[] | select(.value != "" and ((.value | tostring) | test("[\r\n]"))) | .key' \
                | head -1)"
              echo "detect_env_json values must not contain newlines (key: ${bad_key})" >&2
              exit 1
            fi
            while IFS= read -r -d '' entry; do
              printf '%s\n' "${entry}" >> "${GITHUB_ENV}"
            done < <(echo "${DETECT_ENV_JSON}" | jq -jr \
              'to_entries[] | select(.value != "") | "\(.key)=\(.value)\u0000"')
          fi

      - name: Resolve GitHub Token
        id: resolve_github_token
        uses: y-miyazaki/config/.github/actions/loop-resolve-push-token@f6e3dbb4d4df314754d4803421127f8c8c692f69 # v1.9.0

        with:
          bot_app_client_id: ${{ secrets.BOT_APP_CLIENT_ID }}
          bot_app_private_key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          github_token: ${{ secrets.GH_TOKEN }}

      - name: Detect Loop Work
        id: detect
        uses: y-miyazaki/config/.github/actions/loop-detect@f6e3dbb4d4df314754d4803421127f8c8c692f69 # v1.9.0

        with:
          agent_edit_allowlist: ${{ inputs.agent_edit_allowlist }}
          agent_edit_denylist: ${{ inputs.agent_edit_denylist }}
          agent_edit_target: ${{ inputs.agent_edit_target }}
          agent_maker_instructions: ${{ inputs.agent_maker_instructions }}
          agent_maker_skill_name: ${{ inputs.agent_maker_skill_name }}
          agent_unchanged_verdict: ${{ inputs.agent_unchanged_verdict }}
          budget_file: ${{ inputs.budget_file }}
          budget_max_runs_per_day: ${{ inputs.budget_max_runs_per_day != null && format('{0}', inputs.budget_max_runs_per_day) || '' }}
          budget_max_tokens_per_day: ${{ inputs.budget_max_tokens_per_day != null && format('{0}', inputs.budget_max_tokens_per_day) || '' }}
          delivery: ${{ inputs.delivery }}
          detect_branch_match: ${{ inputs.detect_branch_match }}
          detect_branch_match_mode: ${{ inputs.detect_branch_match_mode }}
          detect_max_targets: ${{ format('{0}', inputs.detect_max_targets) }}
          detect_pr_bot_allowlist: ${{ inputs.detect_pr_bot_allowlist }}
          detect_pr_denylist: ${{ inputs.detect_pr_denylist }}
          detect_pr_enabled: ${{ inputs.detect_pr_enabled && 'true' || 'false' }}
          detect_pr_number: ${{ inputs.detect_pr_number != 0 && format('{0}', inputs.detect_pr_number) || '' }}
          detect_priority: ${{ inputs.detect_priority }}
          detect_script: ${{ inputs.detect_script }}
          github_token: ${{ steps.resolve_github_token.outputs.github_token }}
          level: ${{ inputs.level }}
          loop_name: ${{ inputs.loop_name }}
          run_log_file: ${{ inputs.run_log_file }}
          state_branch: ${{ inputs.state_branch }}
          state_file: ${{ inputs.state_file }}

  ack-trigger:
    if: >-
      inputs.trigger_comment_ack &&
      needs.detect.outputs.should_run == 'true' &&
      (github.event_name == 'issue_comment' ||
      github.event_name == 'pull_request_review_comment')
    needs: detect
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Resolve GitHub Token
        id: resolve_github_token
        uses: y-miyazaki/config/.github/actions/loop-resolve-push-token@f6e3dbb4d4df314754d4803421127f8c8c692f69 # v1.9.0

        with:
          bot_app_client_id: ${{ secrets.BOT_APP_CLIENT_ID }}
          bot_app_private_key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          github_token: ${{ secrets.GH_TOKEN }}

      - name: Download Loop Handoff
        if: needs.detect.outputs.handoff_artifact_name != ''
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.detect.outputs.handoff_artifact_name }}
          path: ${{ runner.temp }}/loop-handoff

      - name: Ack Gathered Comments
        continue-on-error: true
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_TOKEN: ${{ steps.resolve_github_token.outputs.github_token }}
          HANDOFF_DIR: ${{ runner.temp }}/loop-handoff
          REPOSITORY: ${{ github.repository }}
          TRIGGER_COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          set -euo pipefail
          ack_one() {
            local comment_id="$1"
            local source="$2"
            local endpoint
            case "${source}" in
              issue_comment)
                endpoint="repos/${REPOSITORY}/issues/comments/${comment_id}/reactions"
                ;;
              pull_request_review_comment)
                endpoint="repos/${REPOSITORY}/pulls/comments/${comment_id}/reactions"
                ;;
              *)
                echo "::warning::Skipping ACK for comment ${comment_id} (unknown source: ${source})"
                return 0
                ;;
            esac
            if gh api --method POST "${endpoint}" -f content='eyes' >/dev/null; then
              echo "::notice title=trigger-ack::Added eyes reaction on comment ${comment_id}"
            else
              echo "::warning::Failed to ACK comment ${comment_id} (${source})"
            fi
          }
          acked=0
          if [[ -d "${HANDOFF_DIR}/payloads" ]] && compgen -G "${HANDOFF_DIR}/payloads/*.json" >/dev/null; then
            while IFS= read -r item; do
              [[ -z "${item}" || "${item}" == "null" ]] && continue
              cid="$(jq -r 'if .comment_id then (.comment_id | tostring) else empty end' <<< "${item}")"
              src="$(jq -r '.source // empty' <<< "${item}")"
              if [[ -z "${cid}" ]]; then
                continue
              fi
              if [[ -z "${src}" ]]; then
                src="${GITHUB_EVENT_NAME}"
              fi
              ack_one "${cid}" "${src}"
              acked=$((acked + 1))
            done < <(jq -sc '
              [.[].result.result.comments // [] | .[]]
              | map({comment_id, source})
              | unique_by(.comment_id)
              | .[]
            ' "${HANDOFF_DIR}"/payloads/*.json)
          fi
          if [[ "${acked}" -eq 0 && -n "${TRIGGER_COMMENT_ID}" && -n "${REPOSITORY}" ]]; then
            ack_one "${TRIGGER_COMMENT_ID}" "${GITHUB_EVENT_NAME}"
          fi

  execute:
    if: >-
      always() &&
      needs.detect.result == 'success' &&
      needs.detect.outputs.should_run == 'true' &&
      (needs.ack-trigger.result == 'success' ||
      needs.ack-trigger.result == 'skipped')
    needs:
      - ack-trigger
      - detect
    permissions:
      actions: read
      contents: write
      copilot-requests: write # zizmor: ignore[excessive-permissions]
      issues: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.detect.outputs.target_matrix) }}
    uses: y-miyazaki/config/.github/workflows/ci-loop-agent.yaml@f6e3dbb4d4df314754d4803421127f8c8c692f69 # v1.9.0

    with:
      agent_branch_prefix: ${{ inputs.agent_branch_prefix }}
      agent_checker_effort: ${{ inputs.agent_checker_effort }}
      agent_checker_instructions: ${{ inputs.agent_checker_instructions }}
      agent_checker_max_turns: ${{ inputs.agent_checker_max_turns }}
      agent_checker_model: ${{ inputs.agent_checker_model }}
      agent_checker_path_pattern: ${{ inputs.agent_checker_path_pattern }}
      agent_checker_skill_name: ${{ inputs.agent_checker_skill_name }}
      agent_cli_version: ${{ inputs.agent_cli_version }}
      agent_commit_message: ${{ inputs.agent_commit_message }}
      agent_edit_allowlist: ${{ inputs.agent_edit_allowlist }}
      agent_edit_denylist: ${{ inputs.agent_edit_denylist }}
      agent_engine: ${{ inputs.agent_engine }}
      agent_loop_max_attempts: ${{ inputs.agent_loop_max_attempts }}
      agent_maker_effort: ${{ inputs.agent_maker_effort }}
      agent_maker_max_turns: ${{ inputs.agent_maker_max_turns }}
      agent_maker_model: ${{ inputs.agent_maker_model }}
      agent_maker_skill_name: ${{ inputs.agent_maker_skill_name }}
      agent_tool_allowlist: ${{ inputs.agent_tool_allowlist }}
      agent_unchanged_verdict: ${{ inputs.agent_unchanged_verdict }}
      delivery: ${{ needs.detect.outputs.delivery }}
      environment: ${{ inputs.environment }}
      finalize_commit_paths: ${{ inputs.finalize_commit_paths }}
      finalize_hook_script: ${{ inputs.finalize_hook_script }}
      finalize_outcome_override: ${{ inputs.finalize_outcome_override }}
      handoff_artifact_name: ${{ needs.detect.outputs.handoff_artifact_name }}
      level: ${{ inputs.level }}
      loop_name: ${{ inputs.loop_name }}
      pr_auto_merge: ${{ needs.detect.outputs.pr_auto_merge }}
      pr_body: ${{ inputs.pr_body }}
      pr_draft: ${{ inputs.pr_draft }}
      pr_labels: ${{ inputs.pr_labels }}
      pr_title: ${{ inputs.pr_title }}
      prompt_text: ${{ matrix.target.prompt }}
      run_log_file: ${{ inputs.run_log_file }}
      run_started_at: ${{ needs.detect.outputs.run_started_at }}
      skip_reason: ${{ needs.detect.outputs.skip_reason }}
      state_branch: ${{ inputs.state_branch }}
      state_file: ${{ needs.detect.outputs.state_file }}
      target_json: ${{ toJson(matrix.target.target_json) }}
      verifier_context: ${{ matrix.target.verifier_context }}
    secrets:
      AGENT_TOKEN: ${{ secrets.AGENT_TOKEN }}
      BOT_APP_CLIENT_ID: ${{ secrets.BOT_APP_CLIENT_ID }}
      BOT_APP_PRIVATE_KEY: ${{ secrets.BOT_APP_PRIVATE_KEY }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}

  record-skip:
    # Record every non-run (circuit_breaker, budget, no_changes) so a quiet
    # cron tick is distinguishable from a loop that never started. Skipped
    # entries do not consume the daily budget (see loop-detect guards.sh).
    if: >-
      needs.detect.result == 'success' &&
      needs.detect.outputs.should_run == 'false'
    needs: detect
    environment: ${{ inputs.environment }}
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve GitHub Token
        id: resolve_github_token
        uses: y-miyazaki/config/.github/actions/loop-resolve-push-token@f6e3dbb4d4df314754d4803421127f8c8c692f69 # v1.9.0

        with:
          bot_app_client_id: ${{ secrets.BOT_APP_CLIENT_ID }}
          bot_app_private_key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          github_token: ${{ secrets.GH_TOKEN }}

      - name: Append Skip Run Log
        uses: y-miyazaki/config/.github/actions/loop-run-log@f6e3dbb4d4df314754d4803421127f8c8c692f69 # v1.9.0

        with:
          github_token: ${{ steps.resolve_github_token.outputs.github_token }}
          loop_name: ${{ inputs.loop_name }}
          outcome: skipped
          run_log_file: ${{ inputs.run_log_file }}
          run_started_at: ${{ needs.detect.outputs.run_started_at }}
          skip_reason: ${{ needs.detect.outputs.skip_reason }}
          state_branch: ${{ inputs.state_branch }}
