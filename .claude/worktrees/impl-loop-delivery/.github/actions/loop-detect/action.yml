name: loop-detect
description: "Detect loop work: enumerate branches/PRs, run detect script per context, build target_matrix."

inputs:
  agent_edit_allowlist:
    default: ""
    description: "Comma-separated glob paths the maker may edit (required at L2/L3; ** = unrestricted; must be empty at L1)"
    required: false
  agent_edit_denylist:
    default: ""
    description: "Comma-separated glob paths the maker must not edit (optional at L2/L3; empty = default denylist; must be empty at L1)"
    required: false
  agent_edit_target:
    default: ""
    description: "Maker artifact: fix | report (required at L2/L3; must be empty at L1)"
    required: false
  agent_maker_instructions:
    default: ""
    description: "Domain-specific maker instructions appended during loop-detect prompt assembly"
    required: false
  agent_maker_skill_name:
    description: "Skill name to invoke (e.g. docs-updater)"
    required: true
  agent_unchanged_verdict:
    default: ""
    description: "Checker verdict when the maker produces no diff: APPROVE | REJECT (required at L2/L3; must be empty at L1)"
    required: false
  budget_file:
    default: ".loop/loop-budget.json"
    description: "Path to loop budget JSON policy file (per-loop keys override budget_max_* inputs)"
    required: false
  budget_max_runs_per_day:
    default: ""
    description: "Default daily run limit when budget file is absent or omits max_runs_per_day"
    required: false
  budget_max_tokens_per_day:
    default: ""
    description: "Default daily token limit when budget file is absent or omits max_tokens_per_day"
    required: false
  delivery:
    description: "Where the agent output is delivered: none | pr_create | pr_push (no default; empty or other values fail)"
    required: true
  detect_branch_match:
    default: ""
    description: "Comma-separated integration branch patterns to watch (empty = no integration targets; not allowed with delivery pr_push)"
    required: false
  detect_branch_match_mode:
    default: "glob"
    description: "detect_branch_match pattern mode: list | glob | regex"
    required: false
  detect_max_targets:
    default: "3"
    description: "Maximum targets per detect run (fan-out cap)"
    required: false
  detect_pr_bot_allowlist:
    default: ""
    description: "Bot logins to include when scanning PRs (empty = exclude all bots)"
    required: false
  detect_pr_denylist:
    default: "fork,draft,label:no-loop"
    description: "PR exclusion tokens (fork,draft,label:<name>,wip_title)"
    required: false
  detect_pr_enabled:
    default: "false"
    description: "Whether to enumerate open pull request heads (required true for delivery pr_push)"
    required: false
  detect_pr_number:
    default: ""
    description: "When set, watch only this open PR number and skip integration fan-out (empty or 0 with delivery pr_push skips with pr_number_missing)"
    required: false
  detect_priority:
    default: "integration,pull_request"
    description: "Target mode priority order (comma-separated)"
    required: false
  detect_script:
    description: "Path to domain detect script (bash)"
    required: true
  github_token:
    description: "Resolved GitHub token for PR enumeration and API calls"
    required: true
  level:
    description: "Autonomy level: L1 | L2 | L3 (no default; empty fails)"
    required: true
  loop_name:
    description: "Loop name for budget lookup (e.g. docs-updater)"
    required: true
  run_log_file:
    default: ".loop/loop-run-log.md"
    description: "Path to JSONL run log for budget aggregation"
    required: false
  state_branch:
    description: "Branch that stores .loop/ state (not watched unless matched by detect_branch_match)"
    required: true
  state_file:
    default: ""
    description: "Path to loop state JSON file (default: .loop/state-<loop_name>.json)"
    required: false

outputs:
  consecutive_failures:
    description: "Consecutive failures for first matrix cell (legacy compat)"
    value: ${{ steps.detect.outputs.consecutive_failures }}
  current_sha:
    description: "Current SHA for first matrix cell (legacy compat)"
    value: ${{ steps.detect.outputs.current_sha }}
  delivery:
    description: "Declared delivery (none | pr_create | pr_push)"
    value: ${{ steps.detect.outputs.delivery }}
  handoff_artifact_name:
    description: "Uploaded artifact name for loop-handoff bundle (empty when should_run=false)"
    value: ${{ steps.handoff.outputs.artifact_name }}
  last_sha:
    description: "Last processed SHA for first matrix cell (legacy compat)"
    value: ${{ steps.detect.outputs.last_sha }}
  pr_auto_merge:
    description: "Whether the created PR is auto-merged: true only when level is L3 and delivery is pr_create"
    value: ${{ steps.detect.outputs.pr_auto_merge }}
  prompt:
    description: "Generated maker prompt for first matrix cell (legacy compat)"
    value: ${{ steps.detect.outputs.prompt }}
  should_run:
    description: "Whether the execute job should run"
    value: ${{ steps.detect.outputs.should_run }}
  skip_reason:
    description: "Why execution was skipped (none | no_changes | circuit_breaker | budget | target_budget | checkout_failed | config_error | pending_pr | pr_number_missing). Invalid level/delivery inputs and non-zero detect-script exit fail the step without skip_reason outputs."
    value: ${{ steps.detect.outputs.skip_reason }}
  state_file:
    description: "Resolved loop state JSON path"
    value: ${{ steps.paths.outputs.state_file }}
  target_matrix:
    description: "JSON array of candidates for matrix fan-out"
    value: ${{ steps.detect.outputs.target_matrix }}

runs:
  using: composite
  steps:
    - name: Resolve State File
      id: paths
      shell: bash
      env:
        LOOP_NAME: ${{ inputs.loop_name }}
        STATE_FILE_INPUT: ${{ inputs.state_file }}
      run: |
        set -euo pipefail
        # shellcheck disable=SC1091
        source "${{ github.action_path }}/../lib/loop/resolve_state_file.sh"
        resolve_state_file

    - name: Detect Targets
      id: detect
      shell: bash
      env:
        AGENT_EDIT_ALLOWLIST: ${{ inputs.agent_edit_allowlist }}
        AGENT_EDIT_DENYLIST: ${{ inputs.agent_edit_denylist }}
        AGENT_EDIT_TARGET: ${{ inputs.agent_edit_target }}
        AGENT_MAKER_INSTRUCTIONS: ${{ inputs.agent_maker_instructions }}
        AGENT_MAKER_SKILL_NAME: ${{ inputs.agent_maker_skill_name }}
        AGENT_UNCHANGED_VERDICT: ${{ inputs.agent_unchanged_verdict }}
        BUDGET_FILE: ${{ inputs.budget_file }}
        BUDGET_MAX_RUNS_PER_DAY: ${{ inputs.budget_max_runs_per_day }}
        BUDGET_MAX_TOKENS_PER_DAY: ${{ inputs.budget_max_tokens_per_day }}
        DELIVERY: ${{ inputs.delivery }}
        DETECT_BRANCH_MATCH: ${{ inputs.detect_branch_match }}
        DETECT_BRANCH_MATCH_MODE: ${{ inputs.detect_branch_match_mode }}
        DETECT_MAX_TARGETS: ${{ inputs.detect_max_targets }}
        DETECT_PRIORITY: ${{ inputs.detect_priority }}
        DETECT_PR_BOT_ALLOWLIST: ${{ inputs.detect_pr_bot_allowlist }}
        DETECT_PR_DENYLIST: ${{ inputs.detect_pr_denylist }}
        DETECT_PR_ENABLED: ${{ inputs.detect_pr_enabled }}
        DETECT_PR_NUMBER: ${{ inputs.detect_pr_number }}
        DETECT_SCRIPT: ${{ inputs.detect_script }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
        LEVEL: ${{ inputs.level }}
        LOOP_NAME: ${{ inputs.loop_name }}
        RUN_LOG_FILE: ${{ inputs.run_log_file }}
        STATE_BRANCH: ${{ inputs.state_branch }}
        STATE_FILE: ${{ steps.paths.outputs.state_file }}
      run: bash "${GITHUB_ACTION_PATH}/lib/detect.sh"

    - name: Record Handoff Artifact Name
      id: handoff
      if: steps.detect.outputs.should_run == 'true'
      shell: bash
      run: echo "artifact_name=loop-handoff-${GITHUB_RUN_ID}" >> "${GITHUB_OUTPUT}"

    - name: Upload Loop Handoff Artifact
      if: steps.detect.outputs.should_run == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: loop-handoff-${{ github.run_id }}
        path: ${{ runner.temp }}/loop-handoff
        retention-days: 1
